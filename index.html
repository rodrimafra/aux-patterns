    };

    function ui() { return DB.ui[lang]; }
    function db() { return DB[lang]; }

    function applyTheme() {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("aup-theme", theme);
      const btn = $("themeBtn");
      btn.innerHTML = theme === "dark" ? ICONS.theme : ICONS.moon;
    }
    $("themeBtn").onclick = () => { theme = theme === "dark" ? "light" : "dark"; applyTheme(); };

    document.querySelectorAll(".lang").forEach(b => b.onclick = () => {
      lang = b.dataset.l; localStorage.setItem("aup-lang", lang); renderAll();
    });

    const FIELDS = {
      "1": "#326E36", "2": "#E95444", "3": "#B15556", "4": "#AF5586", "5": "#2A7EA4",
      "6": "#5D8028", "7": "#A6307F", "8": "#1C8293", "9": "#A86530", "10": "#297AA3"
    };

    function motifHTML(key, asThumb) {
      const k = String(key);
      if (PAT[k]) return PAT[k];
      if (ILLUS[k]) return ILLUS[k];
      return "";
    }

    function thumbHTML(key) {
      const wrap = document.createElement("div");
      wrap.innerHTML = motifHTML(key);
      const svg = wrap.querySelector("svg");
      if (!svg) return wrap.innerHTML;
      const cream = { "#f2eee2": 1, "#f2f1ee": 1, "#d1a19c": 1 };
      const rule = { "#0d0d0d": 1, "#000": 1, "#000000": 1, black: 1 };
      svg.querySelectorAll("path").forEach(el => {
        if (el.closest("mask, clipPath, defs")) return;
        const d = (el.getAttribute("d") || "").replace(/\s+/g, "");
        if (d.indexOf("M2240H0V224") >= 0) el.remove();
      });
      svg.querySelectorAll("[fill], [stroke]").forEach(el => {
        if (el.closest("clipPath, mask, defs")) return;
        const f = (el.getAttribute("fill") || "").toLowerCase();
        const s = (el.getAttribute("stroke") || "").toLowerCase();
        if (cream[f]) el.setAttribute("fill", "var(--thumb-mark)");
        if (rule[f]) el.setAttribute("fill", "var(--thumb-rule)");
        if (cream[s]) el.setAttribute("stroke", "var(--thumb-mark)");
        if (rule[s]) el.setAttribute("stroke", "var(--thumb-rule)");
      });
      return wrap.innerHTML;
    }

    function catIds() { return Object.keys(db().cats); }

    function setHash(hash) {
      const path = location.pathname + location.search + (hash || "");
      history.replaceState(null, "", path);
    }

    function goHome(clearSearch) {
      filter = "all";
      if (clearSearch) { query = ""; const inp = $("q"); if (inp) inp.value = ""; }
      setHash("");
      const dlg = $("dlg");
      if (dlg.open) dlg.close();
      renderGrid();
    }

    function goHub(id, clearSearch) {
      filter = String(id);
      if (clearSearch) { query = ""; const inp = $("q"); if (inp) inp.value = ""; }
      setHash("#cat-" + filter);
      const dlg = $("dlg");
      if (dlg.open) dlg.close();
      renderGrid();
    }

    function restoreHashAfterDialog() {
      if (filter !== "all") setHash("#cat-" + filter);
      else setHash("");
    }

    function renderHero() {
      const u = ui();
      const hero = document.querySelector("header.hero-h");
      const still = $("catStill");
      const back = $("backBtn");
      const searching = !!query;
      const hub = filter !== "all" && !searching;
      if (hub) {
        const cat = db().cats[filter];
        hero.classList.add("cat-on");
        hero.style.setProperty("--illu-field", FIELDS[filter]);
        hero.style.setProperty("--accent", cat.hex);
        $("tTitle").textContent = cat.name;
        $("tSub").textContent = cat.q;
        $("tBlurb").hidden = false;
        $("tBlurb").textContent = cat.b || "";
        still.innerHTML = motifHTML(filter);
        back.hidden = false;
        back.textContent = u.back;
        $("filters").hidden = true;
      } else {
        hero.classList.remove("cat-on");
        hero.style.removeProperty("--illu-field");
        hero.style.removeProperty("--accent");
        $("tTitle").textContent = "Agentic UX Patterns";
        $("tSub").textContent = u.sub;
        $("tBlurb").hidden = true;
        $("tBlurb").textContent = "";
        still.innerHTML = "";
        back.hidden = searching ? false : true;
        back.textContent = u.back;
        $("filters").hidden = false;
      }
    }

    function renderChrome() {
      const u = ui();
      document.documentElement.lang = u.lang;
      $("q").placeholder = u.searchPh;
      $("qLabel").textContent = u.searchPh;
      document.querySelector(".skip").textContent = u.skip;
      $("filters").setAttribute("aria-label", u.searchPh);
      $("tF1").textContent = u.f1;
      $("contactBtn").textContent = u.contact;
      $("licenseLabel").textContent = u.license;
      $("tF2").setAttribute("aria-label", u.footNav);
      $("contactTitle").textContent = u.contact;
      $("cNameL").textContent = u.contactName;
      $("cEmailL").textContent = u.contactEmail;
      $("cSubjectL").textContent = u.contactSubject;
      $("cMessageL").textContent = u.contactMessage;
      $("cSend").textContent = u.contactSend;
      $("contactClose").setAttribute("aria-label", u.close);
      $("contactDlg").setAttribute("aria-label", u.contact);
      $("themeBtn").setAttribute("aria-label", u.theme);
      $("backBtn").textContent = u.back;
      const dlg = $("dlg");
      if (dlg.open && $("dlgTitle")) {
        dlg.setAttribute("aria-labelledby", "dlgTitle");
        dlg.removeAttribute("aria-label");
      } else {
        dlg.setAttribute("aria-label", u.detail);
        dlg.removeAttribute("aria-labelledby");
      }
      document.querySelectorAll(".lang").forEach(b => {
        const on = b.dataset.l === lang;
        b.classList.toggle("on", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      renderHero();
    }

    function categoryCard(id, heading) {
      const h = heading || "h2";
      const cats = db().cats;
      const cat = cats[id];
      const el = document.createElement("article");
      el.className = "card card-cat";
      el.style.setProperty("--illu-field", FIELDS[id]);
      el.style.setProperty("--accent", cat.hex);
      el.innerHTML = '<div class="band" aria-hidden="true">' + motifHTML(id) + '</div>' +
        '<div class="body"><' + h + '><button type="button" class="card-open">' + cat.name + '</button></' + h + '>' +
        '<p>' + cat.q + '</p>' +
        (cat.b ? '<p class="blurb">' + cat.b + '</p>' : '') +
        '</div>';
      el.querySelector(".card-open").onclick = () => goHub(id, true);
      return el;
    }

    function patternCard(p, u, cats) {
      const el = document.createElement("article");
      el.className = "card card-pat";
      el.style.setProperty("--accent", cats[p.c].hex);
      el.style.setProperty("--illu-field", FIELDS[String(p.c)]);
      el.innerHTML = '<div class="band" aria-hidden="true">' + motifHTML(p.n) + '</div>' +
        '<div class="body">' +
        (p.f ? '<span class="feat">' + u.featured + '</span>' : "") +
        '<h2><button type="button" class="card-open">' + p.t + '</button></h2><p>' + p.d + '</p></div>';
      el.querySelector(".card-open").onclick = () => openP(p);
      return el;
    }

    function patternSection(p, u) {
      const el = document.createElement("article");
      el.className = "psec";
      el.id = "sec-" + p.s;
      el.style.setProperty("--accent", db().cats[p.c].hex);
      el.innerHTML = '<div class="psec-thumb" aria-hidden="true">' + thumbHTML(p.n) + '</div>' +
        '<div class="psec-copy">' +
        (p.f ? '<span class="feat">' + u.featured + '</span>' : "") +
        '<h2><button type="button" class="psec-open">' + p.t + '</button></h2>' +
        '<p>' + p.d + '</p>' +
        '<p>' + p.o + '</p></div>';
      el.querySelector(".psec-open").onclick = () => openP(p);
      return el;
    }

    function sectionNav(list, u) {
      const nav = $("secNav");
      nav.hidden = false;
      nav.setAttribute("aria-label", u.onPage);
      nav.innerHTML = "<ol>" +
        list.map(p => '<li><a href="#sec-' + p.s + '" data-sec="sec-' + p.s + '">' + p.t + "</a></li>").join("") +
        "</ol>";
    }

    function hideSectionNav() {
      const nav = $("secNav");
      nav.hidden = true;
      nav.innerHTML = "";
      $("gridWrap").classList.remove("has-rail");
      if (window._secObs) { window._secObs.disconnect(); window._secObs = null; }
    }

    function watchSections(list) {
      if (window._secObs) window._secObs.disconnect();
      const links = [...$("secNav").querySelectorAll("a")];
      if (!links.length) return;
      const map = {};
      links.forEach(a => { map[a.dataset.sec] = a; });
      const setOn = id => {
        links.forEach(a => a.classList.toggle("on", a.dataset.sec === id));
      };
      if (list[0]) setOn("sec-" + list[0].s);
      window._secObs = new IntersectionObserver(entries => {
        const vis = entries.filter(e => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio);
        if (vis[0]) setOn(vis[0].target.id);
      }, { rootMargin: "-20% 0px -60% 0px", threshold: [0, 0.25, 0.5] });
      list.forEach(p => {
        const el = document.getElementById("sec-" + p.s);
        if (el) window._secObs.observe(el);
      });
    }

    function relatedIds(current) {
      const ids = catIds();
      const i = ids.indexOf(String(current));
      const out = [];
      for (let step = 1; out.length < 3 && step < ids.length; step++) {
        out.push(ids[(i + step) % ids.length]);
      }
      return out;
    }

    function renderRelatedAndNext(u, searching) {
      const rel = $("related");
      const next = $("nextCat");
      if (filter === "all" || searching) {
        rel.hidden = true; rel.innerHTML = "";
        next.hidden = true; next.removeAttribute("href");
        return;
      }
      const cats = db().cats;
      rel.hidden = false;
      rel.innerHTML = "<h2>" + u.relatedCats + "</h2>";
      const wrap = document.createElement("div");
      wrap.className = "grid";
      relatedIds(filter).forEach(id => wrap.appendChild(categoryCard(id, "h3")));
      rel.appendChild(wrap);

      const ids = catIds();
      const nxt = ids[(ids.indexOf(String(filter)) + 1) % ids.length];
      next.hidden = false;
      next.href = "#cat-" + nxt;
      next.style.setProperty("--accent", cats[nxt].hex);
      next.innerHTML = '<span class="next-label">' + u.next + '</span><strong>' + cats[nxt].name + '</strong>';
      next.onclick = e => { e.preventDefault(); goHub(nxt, true); };
    }

    function renderGrid(opts) {
      const doRender = () => {
        const u = ui(), cats = db().cats, pats = db().patterns;
        const searching = !!query;
        renderHero();
        const grid = $("grid"); grid.innerHTML = "";
        if (!searching && filter === "all") {
          hideSectionNav();
          grid.className = "grid";
          catIds().forEach(id => grid.appendChild(categoryCard(id)));
          renderRelatedAndNext(u, searching);
          return;
        }
        if (!searching && filter !== "all") {
          grid.className = "sections";
          $("gridWrap").classList.add("has-rail");
          const list = pats.filter(p => p.c === filter);
          sectionNav(list, u);
          list.forEach(p => grid.appendChild(patternSection(p, u)));
          watchSections(list);
          renderRelatedAndNext(u, searching);
          return;
        }
        hideSectionNav();
        grid.className = "grid";
        let shown = 0;
        for (const p of pats) {
          if (filter !== "all" && p.c !== filter) continue;
          if (query && !(p.t + " " + p.d + " " + p.n).toLowerCase().includes(query)) continue;
          grid.appendChild(patternCard(p, u, cats));
          shown++;
        }
        if (!shown) grid.innerHTML = '<div class="empty" role="status">' + u.empty + '</div>';
        renderRelatedAndNext(u, searching);
      };
      const skipVt = (opts && opts.skipVt) || window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!skipVt && document.startViewTransition) document.startViewTransition(doRender);
      else doRender();
    }

    $("q").addEventListener("input", e => { query = e.target.value.toLowerCase(); renderGrid({ skipVt: true }); });
    $("backBtn").addEventListener("click", () => goHome(true));

    function list(items) { return "<ul>" + items.map(i => "<li>" + i + "</li>").join("") + "</ul>"; }

    function patternMarkdown(p, c, u) {
      let md = "# " + p.t + "\n\n";
      md += p.d + "\n\n";
      md += "## " + u.ov + "\n\n" + p.o + "\n\n";
      md += "## " + u.why + "\n\n" + p.w + "\n\n";
      md += "## " + u.use + "\n\n" + p.u.map(i => "- " + i).join("\n") + "\n\n";
      md += "## " + u.avoid + "\n\n" + p.a.map(i => "- " + i).join("\n") + "\n\n";
      md += "## " + u.ex + "\n\n" + p.e.map(i => "- " + i).join("\n") + "\n\n";
      if (p.k && p.k.length) md += "## " + u.take + "\n\n" + p.k.map(i => "- " + i).join("\n") + "\n\n";
      md += "## " + u.rel + "\n\n" + p.r.map(r => "- " + r.t).join("\n") + "\n\n";
      md += "## " + u.read + "\n\n" + p.rd.map(i => "- " + i).join("\n") + "\n";
      return md;
    }

    function openP(p, pushHash = true) {
      const u = ui(), c = db().cats[p.c];
      const sheet = $("sheet");
      sheet.style.setProperty("--accent", c.hex);
      sheet.style.setProperty("--accent-tint", "color-mix(in srgb, " + c.hex + " 16%, transparent)");
      sheet.style.setProperty("--illu-field", FIELDS[String(p.c)]);
      let h = '<div class="hero">';
      h += '<div class="hero-actions">';
      h += '<button type="button" class="icon-btn" id="shareBtn" aria-label="' + u.share + '">' + ICONS.share + '</button>';
      h += '<button type="button" class="icon-btn" id="dlBtn" aria-label="' + u.download + '">' + ICONS.download + '</button>';
      h += '<button type="button" class="icon-btn close" aria-label="' + u.close + '" id="closeBtn">' + ICONS.close + '</button>';
      h += '</div><div class="toast" id="toast" role="status" aria-live="polite"></div>';
      h += '<div class="motif" aria-hidden="true">' + '<div class="plate" style="background:' + FIELDS[String(p.c)] + '">' + motifHTML(p.n) + '</div></div>';
      h += '<div class="hero-copy"><h2 id="dlgTitle">' + p.t + '</h2>';
      h += '<div class="cat"><i>●</i>&nbsp; ' + c.name + ', ' + c.q + '</div>';
      h += '<p class="def">' + p.d + '</p></div></div><div class="dbody">';
      h += '<h3>' + u.ov + '</h3><p>' + p.o + '</p>';
      h += '<h3>' + u.why + '</h3><p>' + p.w + '</p>';
      h += '<div class="two"><div><h3>' + u.use + '</h3>' + list(p.u) + '</div>';
      h += '<div><h3>' + u.avoid + '</h3>' + list(p.a) + '</div></div>';
      h += '<h3>' + u.ex + '</h3>' + list(p.e);
      if (p.k && p.k.length) h += '<h3>' + u.take + '</h3><div class="take">' + list(p.k) + '</div>';
      h += '<h3>' + u.rel + '</h3><div class="rel">' +
        p.r.map(r => '<button type="button" onclick="openByNum(\'' + r.n + '\')">' + r.t + '</button>').join("") + '</div>';
      h += '<h3>' + u.read + '</h3>' + list(p.rd);
      h += '</div>';
      sheet.innerHTML = h;
      $("closeBtn").onclick = () => { $("dlg").close(); };
      $("shareBtn").onclick = async () => {
        const url = location.href.split("#")[0] + "#" + p.s;
        try { await navigator.clipboard.writeText(url); } catch (e) {
          const ta = document.createElement("textarea"); ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
        }
        const t = $("toast");
        t.textContent = u.copied;
        t.classList.add("show");
        setTimeout(() => { t.classList.remove("show"); t.textContent = ""; }, 1600);
      };
      $("dlBtn").onclick = () => {
        const blob = new Blob([patternMarkdown(p, c, u)], { type: "text/markdown;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = (p.s || p.n) + ".md";
        a.click();
        URL.revokeObjectURL(a.href);
      };
      const dlg = $("dlg");
      dlg.setAttribute("aria-labelledby", "dlgTitle");
      dlg.removeAttribute("aria-label");
      if (!dlg.open) dlg.showModal();
      dlg.scrollTop = 0;
      if (pushHash) setHash("#" + p.s);
    }
    window.openByNum = n => { const p = db().patterns.find(x => x.n === n); if (p) openP(p); };
    $("dlg").addEventListener("click", e => { if (e.target.id === "dlg") $("dlg").close(); });
    $("dlg").addEventListener("close", restoreHashAfterDialog);

    function openFromHash() {
      const slug = decodeURIComponent((location.hash || "").replace(/^#/, ""));
      const dlg = $("dlg");
      if (!slug) {
        filter = "all";
        if (dlg.open) dlg.close();
        renderGrid();
        return;
      }
      const catm = /^cat-(\d+)$/.exec(slug);
      if (catm && db().cats[catm[1]]) {
        filter = catm[1];
        if (dlg.open) dlg.close();
        renderGrid();
        return;
      }
      const p = db().patterns.find(x => x.s === slug);
      if (p) {
        if (filter === "all") filter = p.c;
        openP(p, false);
        renderGrid();
      }
    }

    function renderAll() { renderChrome(); openFromHash(); }
    applyTheme();
    $("contactClose").innerHTML = ICONS.close;
    $("contactBtn").addEventListener("click", () => {
      const pat = $("dlg");
      if (pat.open) pat.close();
      $("cStatus").textContent = "";
      $("contactDlg").showModal();
    });
    $("contactClose").addEventListener("click", () => $("contactDlg").close());
    $("contactDlg").addEventListener("click", e => {
      if (e.target.id === "contactDlg") $("contactDlg").close();
    });
    $("contactForm").addEventListener("submit", e => {
      e.preventDefault();
      const name = $("cName").value.trim();
      const email = $("cEmail").value.trim();
      const subject = $("cSubject").value.trim();
      const message = $("cMessage").value.trim();
      if (!name || !email || !subject || !message) {
        $("cStatus").textContent = ui().contactNeed;
        return;
      }
      if (!$("cEmail").checkValidity()) {
        $("cStatus").textContent = ui().contactNeed;
        $("cEmail").focus();
        return;
      }
      const body = name + " <" + email + ">\n\n" + message;
      const href = "mailto:rodrigo@mafra.me?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
      $("cStatus").textContent = ui().contactSent;
      window.location.href = href;
    });
    renderAll();
    window.addEventListener("hashchange", openFromHash);
  </script>
</body>

</html>
