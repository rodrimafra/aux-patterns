ents preceding new agent capabilities","Audit preparation and evidence"],"a":["Startups with two agents and no compliance surface, premature machinery"],"e":["Cloud security posture dashboards as prior art","DLP consoles mapping sensitive data flows","Model-risk registers in financial institutions"],"r":[{"n":"10.1","t":"Fleet health dashboard"},{"n":"10.3","t":"Access & permission tiers for agents"},{"n":"3.5","t":"Scoped permissions & tool consent"}],"f":0,"k":[],"rd":["Human-Centered AI (Ben Shneiderman","Building Effective Agents) Anthropic"],"s":"risk-and-policy-heatmaps"},{"n":"10.3","t":"Access & permission tiers for agents","d":"Role-based capability levels for agents, mirroring how organisations already tier human access.","c":"10","o":"Organisations don't give interns production keys; agents deserve the same discipline. Tiers bundle scopes into named levels (read-only, contributor, trusted operator) with promotion criteria and review cycles.","w":"Tiering scales consent: instead of auditing hundreds of individual scope grants, governance reasons about a handful of well-defined levels.","u":["Fleets of agents with varied maturity and blast radius","Progressive promotion as agents prove reliability","Mapping agent access to existing IAM structures"],"a":["Solo agents, where direct scoped permissions suffice"],"e":["IAM roles and policies as the direct ancestor","Enterprise AI policies tiering tool access","Staged rollouts granting capability by cohort"],"r":[{"n":"3.5","t":"Scoped permissions & tool consent"},{"n":"10.2","t":"Risk & policy heatmaps"},{"n":"7.2","t":"Agent registry & profiles"}],"f":0,"k":[],"rd":["Human-Centered AI (Ben Shneiderman","Building Effective Agents) Anthropic"],"s":"access-and-permission-tiers-for-agents"},{"n":"10.4","t":"Workflow & policy template library","d":"A curated library of approved agent workflows and policies, reusable across the organisation.","c":"10","o":"Every team reinventing agent governance produces inconsistency at best. The library packages vetted workflows (with their permissions, gates, and escalation rules baked in) as the paved road teams actually want to take.","w":"Templates make the compliant path the easy path. Governance embedded in reusable artifacts scales; governance in documents does not.","u":["Multi-team organisations standardising agent practice","Compliance requirements needing consistent enforcement","Accelerating new-team adoption safely"],"a":["A library without ownership rots into a liability"],"e":["Terraform modules as governance-as-code prior art","Shared workflow templates in automation platforms","Enterprise prompt and policy libraries"],"r":[{"n":"2.5","t":"Scenario templates & recipes"},{"n":"10.3","t":"Access & permission tiers for agents"},{"n":"10.1","t":"Fleet health dashboard"}],"f":0,"k":[],"rd":["Human-Centered AI (Ben Shneiderman","Building Effective Agents) Anthropic"],"s":"workflow-and-policy-template-library"}]},"pt":{"cats":{"1":{"name":"Identidade e delegação","q":"Quem é este agente, e até onde ele pode ir?","hex":"#f59e0b","b":"Deixe claro quem é o agente, o que ele faz e o que fica fora. A pessoa escolhe quanto quer delegar."},"2":{"name":"Aprendizado e primeiros passos","q":"Como as pessoas descobrem o que o agente pode fazer?","hex":"#34d399","b":"Dá para aprender o alcance do agente antes de confiar. Treino, guias e modelos prontos vencem um manual eterno."},"3":{"name":"Controle e direção","q":"Como as pessoas ficam no comando?","hex":"#f87171","b":"Pausar, redirecionar, aprovar e desfazer. Quem usa continua no comando enquanto o trabalho roda."},"4":{"name":"Clarificação","q":"E quando o agente ainda não sabe o bastante?","hex":"#f472b6","b":"Se falta informação, o agente pergunta de forma organizada. Não inventa o que não sabe."},"5":{"name":"Transparência do processo","q":"O que ele está fazendo agora?","hex":"#38bdf8","b":"Mostre o plano, o passo atual e o que já rodou. Trabalho no escuro não vale."},"6":{"name":"Transparência de certeza","q":"Com que certeza ele fala, e por quê?","hex":"#a3e635","b":"Mostre o quanto a resposta é firme, e o porquê. Palpite não pode parecer fato."},"7":{"name":"Sistemas com vários agentes","q":"E quando tem mais de um agente?","hex":"#a78bfa","b":"Com mais de um agente, papel, passagem de bastão e dono da tarefa precisam ficar óbvios."},"8":{"name":"Memória e contexto","q":"O que ele sabe sobre mim?","hex":"#22d3ee","b":"O que ele guarda sobre você, onde isso mora, e como você vê ou limita."},"9":{"name":"Falha e reparo","q":"E quando ele erra?","hex":"#fb923c","b":"Erro à vista, explicação do que falhou, e um jeito de consertar sem recomeçar do zero."},"10":{"name":"Governança e supervisão","q":"Como a organização acompanha vários agentes?","hex":"#818cf8","b":"Política, acesso e registro para um conjunto de agentes. Supervisão que vai além de um chat só."}},"patterns":[{"r":[{"n":"1.2","t":"Modos de delegação"},{"n":"3.5","t":"Permissões com escopo e consentimento de ferramentas"},{"n":"8.3","t":"Controles de privacidade e uso de dados"}],"d":"Uma declaração clara e inspecionável do que o agente é, para que serve e até onde vai o mandato dele.","s":"agent-identity-and-role-contract","w":"A confiança começa na previsibilidade. Um mandato declarado permite calibrar as expectativas antes da primeira interação e dá base para reclamar quando o agente sai do combinado.","c":"1","k":[],"e":["Resumos das instruções de GPTs personalizados exibidos antes do primeiro uso","Perfis de apps no Slack listando os escopos e as permissões concedidas","A constituição declarada e as políticas de uso do Claude"],"f":0,"t":"Identidade e contrato de papel do agente","n":"1.1","o":"Antes de delegar qualquer coisa, a pessoa precisa saber para quem está delegando. Esse padrão dá a cada agente um contrato visível: seu propósito, o que ele sabe fazer, seus limites e o que ele nunca vai fazer. Esse contrato é uma promessa que a interface mantém.","a":["Ferramentas reativas de propósito único, em que o escopo é óbvio por si só"],"u":["Apresentar um agente novo às pessoas pela primeira vez","Produtos em que um agente, entre vários, precisa ser distinguível","Domínios regulados em que o escopo precisa estar documentado"],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","Microsoft HAX Toolkit"]},{"r":[{"n":"1.1","t":"Identidade e contrato de papel do agente"},{"n":"3.2","t":"Portões com humano no circuito"},{"n":"3.3","t":"Planejar antes de executar"}],"d":"Níveis claros de autonomia que a pessoa escolhe: só sugerir, pedir confirmação ou agir sozinho.","s":"delegation-modes","w":"As pessoas confiam em sistemas cuja autonomia elas mesmas escolheram. Modos graduais deixam quem é cauteloso começar no nível baixo e subir aos poucos, conforme o agente prova o próprio valor, em vez de forçar uma aposta de tudo ou nada.","c":"1","k":[],"e":["O espectro do GitHub Copilot, do texto fantasma sugerido ao modo agente autônomo","Os modos ask / edit / agent do Cursor","Os níveis de assistência ao motorista como modelo mental clássico"],"f":0,"t":"Modos de delegação","n":"1.2","o":"Autonomia não é um botão liga-desliga, é um seletor de níveis. Esse padrão expõe modos distintos e bem rotulados (sugerir, pedir confirmação antes de agir, agir e relatar) para a pessoa escolher quanto controle entrega por tarefa, por contexto ou por agente.","a":["Ações triviais, em que escolher o modo atrapalha mais que a própria ação"],"u":["Agentes cujas ações têm consequências no mundo real","Primeiros passos em que a confiança precisa ser conquistada aos poucos","Usuários avançados e iniciantes dividindo o mesmo produto"],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","Microsoft HAX Toolkit"]},{"r":[{"n":"2.5","t":"Modelos de cenário e receitas"},{"n":"3.6","t":"Reversão e histórico de versões"},{"n":"9.1","t":"Estados de falha segura"}],"d":"Um espaço sem consequência real onde a pessoa experimenta o agente antes de liberar acesso de verdade.","s":"sandboxed-playgrounds","w":"Experiência direta vale mais que documentação. Um ensaio sem risco transforma promessas abstratas de capacidade em comportamento observado, que é como as pessoas de fato calibram a confiança.","c":"2","k":[],"e":["O modo de teste da Stripe como arquétipo","O OpenAI Playground para observar o comportamento do modelo","Espaços de demonstração em produtos de analytics e CRM"],"f":0,"t":"Ambientes seguros para testar","n":"2.1","o":"Ninguém entrega a chave do carro para um estranho. Ambientes seguros deixam a pessoa ver o agente trabalhar com dados de exemplo, contas simuladas ou cópias reversíveis, formando um modelo mental fiel antes de arriscar algo de verdade.","a":["Quando o espaço de teste se comporta diferente demais da produção e acaba ensinando o modelo errado"],"u":["Domínios de alto risco (dinheiro, jurídico, sistemas em produção)","Agentes cheios de capacidade que as pessoas subestimam ou superestimam","Momentos de venda e de primeiros passos"],"rd":["People + AI Guidebook (Google PAIR","Shape of AI) Emily Campbell"]},{"r":[{"n":"2.3","t":"Modos de revelação progressiva"},{"n":"2.5","t":"Modelos de cenário e receitas"},{"n":"4.1","t":"Perguntas de clarificação estruturadas"}],"d":"Pistas no fluxo que mostram o que o agente pode fazer a seguir, sem mandar a pessoa ler um manual.","s":"wayfinders","w":"Descobrir no contexto não custa nada; descobrir na documentação custa uma viagem que ninguém faz. Os chips de sugestão também servem para revelar o que o agente sabe fazer.","c":"2","k":[],"e":["Os prompts sugeridos do ChatGPT em conversas novas","O menu de comandos contextual do Notion AI","Os empurrõezinhos contextuais do Gmail (dar seguimento, sugestões de resposta)"],"f":0,"t":"Sinais de caminho","n":"2.2","o":"Agentes de tela em branco fracassam porque a capacidade fica invisível. Sinais de caminho trazem sugestões oportunas e cientes da situação, não um manual, mas placas colocadas exatamente onde a pessoa já está.","a":["Sugestões que interrompem o trabalho concentrado; sinalizar caminho nunca pode virar propaganda"],"u":["Interfaces de conversa com capacidade ampla e invisível","Telas de primeiro uso e estados vazios","Logo após uma tarefa concluída, para emendar a próxima"],"rd":["People + AI Guidebook (Google PAIR","Shape of AI) Emily Campbell"]},{"r":[{"n":"1.2","t":"Modos de delegação"},{"n":"2.2","t":"Sinais de caminho"},{"n":"8.2","t":"Preferências de persona"}],"d":"Autonomia e capacidades avançadas reveladas gradualmente, conforme a habilidade e a confiança demonstradas pelo usuário.","s":"progressive-disclosure-modes","w":"A carga mental fica administrável e a confiança cresce sobre evidências. Quem nunca precisa do nível avançado nunca paga o imposto de complexidade dele.","c":"2","k":[],"e":["Recursos do Copilot liberados conforme marcos de uso","Configurações avançadas escondidas atrás de menus progressivos","Liberação gradual de autonomia em apps de finanças"],"f":0,"t":"Modos de revelação progressiva","n":"2.3","o":"Todo o poder de um agente logo no primeiro dia é ruído. Esse padrão põe a capacidade em sequência: assistência simples primeiro, autonomia mais profunda liberada conforme o uso sinaliza preparo, espelhando como se dá responsabilidade a um colega novo.","a":["Ferramentas de especialista, em que travar recursos frustra quem já chega habilidoso"],"u":["Agentes cheios de recursos servindo níveis de habilidade variados","Autonomia que é perigosa em mãos não treinadas","Produtos de longa duração em que as relações se aprofundam"],"rd":["People + AI Guidebook (Google PAIR","Shape of AI) Emily Campbell"]},{"r":[{"n":"2.2","t":"Sinais de caminho"},{"n":"6.5","t":"Explicação sob demanda"},{"n":"2.6","t":"Controles de avaliação e retorno"}],"d":"O agente demonstra e explica como trabalhar com ele, transformando instrução em interação.","s":"teach-me-interfaces","w":"As pessoas aprendem ferramentas usando-as com um guia. Um agente que ensina o próprio funcionamento encurta o tempo até a competência e reduz as primeiras sessões abandonadas.","c":"2","k":[],"e":["O Duolingo Max explicando as respostas em vez de só marcar certo ou errado","Tours de produto interativos guiados por dados reais do usuário","O Copilot explicando uma mudança sugerida quando a pessoa pede"],"f":0,"t":"Interfaces que ensinam","n":"2.4","o":"Em vez de entregar um manual, o agente é o manual. Ele conduz a pessoa pelas próprias capacidades com exemplos ao vivo, explica por que uma abordagem funcionou e, com o tempo, orienta a delegar melhor.","a":["Quando o momento de ensino interrompe em vez de servir à tarefa atual"],"u":["Paradigmas de interação inéditos, sem convenções herdadas","Capacidade complexa que recompensa quem escreve bons pedidos","Reintrodução após mudanças grandes de capacidade"],"rd":["People + AI Guidebook (Google PAIR","Shape of AI) Emily Campbell"]},{"r":[{"n":"2.1","t":"Ambientes seguros para testar"},{"n":"2.2","t":"Sinais de caminho"},{"n":"10.4","t":"Biblioteca de modelos de fluxo e políticas"}],"d":"Fluxos de trabalho prontos e editáveis que codificam o que o agente faz bem.","s":"scenario-templates-and-recipes","w":"Modelos transferem a expertise dos poucos que exploram para os muitos que adotam. Também restringem o uso inicial a caminhos que o agente domina com segurança.","c":"2","k":[],"e":["Os modelos de fluxo com IA do Zapier","A GPT Store como um mercado de receitas","A galeria de modelos do Notion aplicada a fluxos com IA"],"f":0,"t":"Modelos de cenário e receitas","n":"2.5","o":"Um modelo é uma promessa de capacidade que dá para executar. Receitas empacotam fluxos de várias etapas já comprovados (entradas, passos, saídas esperadas) para a pessoa começar de exemplos que funcionam, em vez de um pedido em branco.","a":["Quando os modelos endurecem e viram o único jeito de as pessoas usarem o produto"],"u":["Agentes amplos cujos melhores usos não são óbvios","Contextos de time em que os fluxos deveriam ser compartilhados","Reduzir a variação na qualidade das saídas"],"rd":["People + AI Guidebook (Google PAIR","Shape of AI) Emily Campbell"]},{"r":[{"n":"2.4","t":"Interfaces que ensinam"},{"n":"8.2","t":"Preferências de persona"},{"n":"9.2","t":"Fluxos guiados de reparo"}],"d":"Jeitos leves, no próprio fluxo, de avaliar a saída do agente e ver a melhoria acontecer.","s":"feedback-and-rating-controls","w":"Retorno que melhora o comportamento de forma visível converte quem consome em quem treina, aprofundando o vínculo. Caixas de avaliação silenciosas ensinam a pessoa a parar de se dar ao trabalho.","c":"2","k":[],"e":["As notas de resposta do ChatGPT","O aceitar ou descartar do Copilot como sinal implícito","A classificação de imagens do Midjourney alimentando as preferências do modelo"],"f":0,"t":"Controles de avaliação e retorno","n":"2.6","o":"Joinha, estrelas, aceitar ou recusar: o sinal importa menos que o ciclo. Esse padrão capta o julgamento no momento do uso e, o que é essencial, mostra à pessoa que a avaliação dela mudou alguma coisa.","a":["Questionários trabalhosos, quando um sinal de um toque bastaria"],"u":["Qualquer saída gerada que a pessoa consiga julgar na hora","Sistemas que personalizam por pessoa ou por time","Produtos em estágio inicial caçando modos de falha"],"rd":["People + AI Guidebook (Google PAIR","Shape of AI) Emily Campbell"]},{"r":[{"n":"3.4","t":"Direcionamento e interrupção cortês"},{"n":"3.6","t":"Reversão e histórico de versões"},{"n":"9.1","t":"Estados de falha segura"}],"d":"Um controle sempre disponível para interromper o agente na hora, sem perder o trabalho em andamento.","s":"kill-switch-pause-and-resume","w":"Saber que dá para parar é o que torna seguro começar. A interrupção recuperável tira o custo do medo de delegar, então a pessoa concede mais autonomia no geral.","c":"3","k":[],"e":["Os controles de parar geração em todos os grandes produtos de chat","A pausa e o redirecionamento no meio da execução do Devin","O cancelamento de pipelines de CI/CD como precedente"],"f":0,"t":"Botão de parada, pausar e retomar","n":"3.1","o":"O botão mais importante na UX de agentes é o de parar. Esse padrão garante que a interrupção seja imediata, sem perda e reversível: pausar preserva o estado, retomar continua, parar abandona sem bagunça.","a":["Nunca omita esse controle; o antipadrão é a ausência dele"],"u":["Toda execução autônoma que dure mais que um instante","Ações cujo custo ou consequência cresce com o tempo","Agentes operando em sistemas externos ao vivo"],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"]},{"r":[{"n":"3.3","t":"Planejar antes de executar"},{"n":"1.2","t":"Modos de delegação"},{"n":"5.1","t":"Vislumbre do raciocínio"}],"d":"Pontos em que o agente pausa e pede aprovação explícita antes de seguir, por consequência, não por hábito.","s":"human-in-the-loop-gates","w":"Os portões convertem a autonomia de um salto de fé em uma passagem supervisionada. Bem colocados, concentram a atenção humana exatamente onde ela é insubstituível; colocados com preguiça, geram fadiga de aprovação que derruba o próprio propósito.","c":"3","k":["Coloque os portões por consequência e reversibilidade, não de forma uniforme","Faça de cada portão um resumo: o quê, por quê, com qual evidência e o que vem depois","Escalone as aprovações: portão nas ações inéditas, fluxo livre nas rotinas comprovadas","Meça a fadiga de portão: aprovar sem ler é falha de design"],"e":["Os pedidos de permissão do Claude Code antes de rodar comandos ou editar arquivos","As etapas de aprovação de deploy no GitHub Actions e em pipelines de release","A confirmação de pagamento com etapa extra por biometria em apps de banco","A aprovação do plano do Devin antes da execução autônoma"],"f":1,"t":"Portões com humano no circuito","n":"3.2","o":"Nem toda ação precisa de aprovação; aprovar tudo é só um produto manual mais lento. Os portões com humano no circuito são pontos de verificação deliberados, colocados onde a consequência e a irreversibilidade são altas: enviar o e-mail, mover o dinheiro, apagar os dados. Abaixo da linha do portão, o agente age livremente. Acima dela, quem decide é uma pessoa. O portão em si precisa ser informativo: um resumo antes da ação cobrindo o que o agente quer fazer, por quê, com base em qual evidência e o que vem depois, nunca um Confirmar/Cancelar seco que treina o clique cego.","a":["Ações rotineiras e reversíveis; a fadiga de portão ensina a pessoa a parar de ler","Como escudo de responsabilidade, sem conteúdo real de decisão"],"u":["Ações irreversíveis ou custosas (pagamentos, envios, exclusões, contratos)","A primeira ocorrência de uma nova classe de ação, antes de a confiança se firmar","Fluxos regulados que exigem consentimento documentado"],"rd":["Building Effective Agents) Anthropic","Human-Centered AI, Ben Shneiderman"]},{"r":[{"n":"3.2","t":"Portões com humano no circuito"},{"n":"4.3","t":"Suposições confirmadas"},{"n":"5.5","t":"Visão de progresso da execução"}],"d":"O agente propõe um plano completo para revisão antes de qualquer ação.","s":"plan-then-execute-workflow","w":"Um plano é o lugar mais barato possível para pegar um mal-entendido. Revisar a intenção custa segundos; reverter a execução pode custar horas, ou ser impossível.","c":"3","k":[],"e":["O modo de plano do Claude Code","O plano de tarefa editável do Devin antes de rodar","O fluxo de especificar e planejar do Copilot Workspace antes de mudar o código"],"f":0,"t":"Planejar antes de executar","n":"3.3","o":"Em vez de agir passo a passo rumo ao desconhecido, o agente pensa primeiro e mostra o trabalho: um plano estruturado que a pessoa pode aprovar, editar ou recusar. A execução só começa depois que o humano viu o formato do que vem pela frente.","a":["Tarefas rápidas de uma etapa só, em que o teatro do planejamento atrasa tudo"],"u":["Tarefas de várias etapas que mexem em sistemas reais","Pedidos ambíguos em que a interpretação deveria ser verificada","Operações caras (processamento, dinheiro, o tempo de outras pessoas)"],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"]},{"r":[{"n":"3.1","t":"Botão de parada, pausar e retomar"},{"n":"4.2","t":"Edição da solicitação"},{"n":"5.5","t":"Visão de progresso da execução"}],"d":"Usuários podem redirecionar um agente em execução sem cancelar e recomeçar.","s":"steerability-and-polite-interruption","w":"Corrigir o rumo é mais barato que recomeçar. Sistemas que punem a interrupção com trabalho perdido ensinam a pessoa a delegar de menos.","c":"3","k":[],"e":["O direcionamento por mensagens de acompanhamento no Cursor e no Claude Code enquanto os agentes trabalham","Interromper um assistente de voz no meio da resposta","Editar um pedido em andamento nas interfaces de chat modernas"],"f":0,"t":"Direcionamento e interrupção cortês","n":"3.4","o":"Delegar é uma conversa, não a assinatura de um contrato. Esse padrão deixa a pessoa intervir (refinar o objetivo, corrigir o rumo, acrescentar restrições) enquanto o agente incorpora a mudança com naturalidade e segue em frente.","a":["Transações atômicas que realmente não absorvem mudança no meio do caminho"],"u":["Tarefas longas de geração ou pesquisa","Trabalho criativo iterativo em que os objetivos se afinam no meio do caminho","Interfaces de voz, em que interromper é natural"],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"]},{"r":[{"n":"1.1","t":"Identidade e contrato de papel do agente"},{"n":"3.2","t":"Portões com humano no circuito"},{"n":"10.3","t":"Níveis de acesso e permissão para agentes"}],"d":"Concessões granulares e revogáveis controlando quais ferramentas, dados e ações um agente pode usar.","s":"scoped-permissions-and-tool-consent","w":"A granularidade deixa a pessoa dizer sim às partes úteis sem bancar as perigosas. Cada escopo concedido é uma decisão pensada, não uma rendição.","c":"3","k":[],"e":["As telas de consentimento de escopo do OAuth","As permissões por capacidade dos apps no iOS","O modelo de permissão por ferramenta do Claude"],"f":0,"t":"Permissões com escopo e consentimento de ferramentas","n":"3.5","o":"Acesso de tudo ou nada é como a confiança morre. Esse padrão decompõe a capacidade do agente em escopos inspecionáveis (ler a agenda, enviar e-mail, gastar até certo valor) concedidos um a um, revogáveis na hora e visíveis num só lugar.","a":["Fragmentar os escopos de forma tão fina que o consentimento vira ruído"],"u":["Agentes que se conectam a contas e APIs externas","Capacidade financeira ou destrutiva","Implantação em empresa com requisitos de conformidade"],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"]},{"r":[{"n":"3.1","t":"Botão de parada, pausar e retomar"},{"n":"9.1","t":"Estados de falha segura"},{"n":"5.4","t":"Linha do tempo de atividades e log de auditoria"}],"d":"Toda ação do agente é registrada e reversível; o estado pode ser restaurado a qualquer ponto anterior.","s":"rollback-and-version-history","w":"A reversibilidade transforma risco em experimento. Quem sabe que pode voltar atrás delega mais cedo, concede mais e entra menos em pânico quando algo parece errado.","c":"3","k":[],"e":["O Git como precedente profundo","O histórico de versões do Figma e do Notion","A restauração por ponto de verificação em ferramentas de código com agentes"],"f":0,"t":"Reversão e histórico de versões","n":"3.6","o":"O desfazer é a base do uso sem medo. Estendido aos agentes, é um histórico navegável do que mudou, quando e por quem (pessoa ou agente), com restauração em um passo.","a":["Ações externas genuinamente irreversíveis, que é exatamente onde entram os portões com humano no circuito"],"u":["Agentes que modificam documentos, código ou configuração","Operações em lote sobre muitos itens","Qualquer lugar onde existiria um desfazer para uma pessoa fazendo o mesmo trabalho"],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"]},{"r":[{"n":"3.5","t":"Permissões com escopo e consentimento de ferramentas"},{"n":"6.1","t":"Ancoragem em fontes e fundamentação"},{"n":"8.4","t":"Repositório de contexto e perfis de espaço de trabalho"}],"d":"Usuários escolhem quais ferramentas, fontes e modos de saída o agente pode empregar numa tarefa.","s":"user-directed-tool-use","w":"Restringir o método é uma forma de direcionamento que evita classes inteiras de erro antes que aconteçam e ensina à pessoa quais são, de fato, as ferramentas do agente.","c":"3","k":[],"e":["Os seletores de foco e de fontes do Perplexity","Os interruptores de ferramentas (web, código, canvas) no ChatGPT","Os seletores de modelo e de contexto em IDEs com agentes"],"f":0,"t":"Uso de ferramentas dirigido pelo usuário","n":"3.7","o":"Às vezes a pessoa sabe melhor como o trabalho deve ser feito. Esse padrão expõe a caixa de ferramentas do agente (buscar na web ou não, usar este conjunto de dados, gerar uma tabela em vez de texto corrido) como controles explícitos, por tarefa.","a":["Deixar a seleção manual de ferramentas como padrão para quem só quer o resultado"],"u":["Tarefas de pesquisa em que a qualidade da fonte importa","Saídas destinadas a formatos específicos mais adiante","Pessoas com restrições rígidas (privacidade, custo, conformidade)"],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"]},{"r":[{"n":"4.2","t":"Edição da solicitação"},{"n":"4.3","t":"Suposições confirmadas"},{"n":"2.2","t":"Sinais de caminho"}],"d":"Quando precisa de informação, o agente pergunta com opções concretas, não perguntas abertas.","s":"structured-clarification-prompts","w":"As opções revelam o que o agente considerou, ensinam o raciocínio dele e derrubam o esforço de resposta para quase zero. Perguntas abertas devolvem toda a carga mental para a pessoa.","c":"4","k":[],"e":["Perguntas de esclarecimento de múltipla escolha em ferramentas de código com agentes","Chips de preenchimento em fluxos de viagem e reserva","Perguntas de desambiguação na busca"],"f":0,"t":"Perguntas de clarificação estruturadas","n":"4.1","o":"Perguntar “como assim?” trava o trabalho. A clarificação estruturada apresenta a ambiguidade como escolhas (sentidos interpretados, opções delimitadas, padrões sensatos) para que resolvê-la leve um toque, não um parágrafo.","a":["Direção criativa genuinamente aberta, em que as opções ancorariam cedo demais"],"u":["Ambiguidade com um pequeno conjunto de leituras plausíveis","Contextos de celular e de voz em que digitar custa caro","Pontos de decisão repetidos que merecem padrões lembrados"],"rd":["People + AI Guidebook (Google PAIR","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"]},{"r":[{"n":"4.1","t":"Perguntas de clarificação estruturadas"},{"n":"4.3","t":"Suposições confirmadas"},{"n":"3.4","t":"Direcionamento e interrupção cortês"}],"d":"O agente mostra sua interpretação do pedido e deixa o usuário corrigi-la diretamente.","s":"edit-request","w":"Corrigir um entendimento errado na camada da interpretação é cirúrgico; corrigi-lo no vai e volta da conversa é arqueologia.","c":"4","k":[],"e":["Geradores de imagem que expõem os pedidos revisados por eles","O “exibindo resultados para…” dos buscadores, com opção de sobrepor","Especificações de tarefa editáveis no Copilot Workspace"],"f":0,"t":"Edição da solicitação","n":"4.2","o":"Entre o que foi dito e o que foi entendido mora a maior parte das falhas de agente. Esse padrão externaliza a interpretação (um pedido reescrito, uma instrução expandida) como um artefato editável, antes ou depois da execução.","a":["Pedidos triviais, em que mostrar a interpretação é puro peso morto"],"u":["Pedidos complexos com restrições embutidas","Sistemas que reescrevem ou expandem os pedidos por dentro","Tarefas recorrentes cujos pedidos merecem refinamento com o tempo"],"rd":["People + AI Guidebook (Google PAIR","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"]},{"r":[{"n":"4.1","t":"Perguntas de clarificação estruturadas"},{"n":"4.2","t":"Edição da solicitação"},{"n":"3.3","t":"Planejar antes de executar"}],"d":"O agente declara as suposições sobre as quais está prosseguindo, permitindo correção sem bloquear o trabalho.","s":"confirmed-assumptions","w":"O trabalho continua a todo vapor enquanto cada suposição segue visível e corrigível. Os erros aparecem no momento da divergência, não só na entrega.","c":"4","k":[],"e":["Padrões declarados em fluxos de reserva (“econômica, 1 adulto”, quer mudar?)","Agentes anotando as escolhas de interpretação na própria saída de trabalho","Configurações detectadas automaticamente, com sobreposição visível"],"f":0,"t":"Suposições confirmadas","n":"4.3","o":"Suposições silenciosas são minas terrestres; perguntas que bloqueiam são quebra-molas. O caminho do meio: declarar as suposições ali mesmo (“assumindo que Q3 é o trimestre do calendário”) e seguir, a menos que a pessoa se oponha.","a":["Bifurcações de alto risco, em que uma suposição errada é cara (aí é melhor perguntar)"],"u":["Ambiguidade com uma leitura fortemente provável","Tarefas sensíveis ao tempo, em que bloquear sai caro","Tarefas longas, em que as suposições se acumulam"],"rd":["People + AI Guidebook (Google PAIR","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"]},{"r":[{"n":"5.3","t":"Indicadores de uso de ferramentas"},{"n":"5.5","t":"Visão de progresso da execução"},{"n":"6.5","t":"Explicação sob demanda"}],"d":"Uma janela breve e honesta sobre o que o agente está fazendo e por quê, o suficiente para provar trabalho real, sem expor a maquinaria.","s":"reasoning-glimpse","w":"A competência percebida acompanha o processo visível. As pessoas confiam mais nos resultados quando testemunham um esforço crível, mas só se a exibição for verdadeira; animações decorativas de “pensando” corroem a confiança na primeira vez que são pegas mentindo.","c":"5","k":["Faça as pistas específicas da tarefa, geradas do trabalho real, nunca enlatadas","Mostre o tipo de trabalho, não a transcrição inteira","Ajuste o detalhe da pista ao tamanho e ao risco da tarefa","A honestidade é a restrição: um vislumbre que mente é pior que o silêncio"],"e":["O raciocínio resumido em modelos de raciocínio (série o da OpenAI, o pensamento estendido do Claude)","A exibição ao vivo das etapas do Perplexity: buscando, lendo fontes, redigindo","A narração de chamadas de ferramenta em IDEs com agentes (buscando no código, rodando testes)"],"f":1,"t":"Vislumbre do raciocínio","n":"5.1","o":"Um agente que fica em silêncio e devolve uma resposta pede fé cega. Um agente que narra cada passo interno é cansativo, e quase sempre encenação. O vislumbre do raciocínio fica de propósito no meio: linhas de status curtas e específicas da tarefa que dizem à pessoa que tipo de trabalho está acontecendo (“lendo o contrato… extraindo as condições de pagamento… conferindo as datas”) e um raciocínio resumido disponível num relance. O teste de honestidade é a especificidade: pistas geradas a partir do trabalho real soam como relato; pistas genéricas soam como um indicador de carregamento fantasiado.","a":["Fingir sinais de processo que não correspondem a trabalho real","Transmitir a cadeia de raciocínio crua, que mais sobrecarrega do que informa"],"u":["Tarefas mais longas que alguns segundos, em que o silêncio soa como falha","Análises complexas cujo valor a pessoa não consegue julgar só pela resposta","Construir confiança no início de uma relação nova com o agente"],"rd":["Building Effective Agents) Anthropic","Shape of AI, Emily Campbell"]},{"r":[{"n":"5.1","t":"Vislumbre do raciocínio"},{"n":"3.4","t":"Direcionamento e interrupção cortês"},{"n":"5.5","t":"Visão de progresso da execução"}],"d":"A saída aparece aos poucos enquanto é produzida, deixando ritmo e direção visíveis.","s":"streaming-results-visualizations","w":"A visibilidade cedo permite a correção cedo, e a renderização gradual mantém o engajamento durante esperas que uma tela em branco perderia.","c":"5","k":[],"e":["A transmissão token a token nos produtos de chat","A resolução progressiva de imagem do Midjourney","Tabelas de resultado atualizadas ao vivo em agentes de pesquisa"],"f":0,"t":"Resultados em transmissão contínua","n":"5.2","o":"Transmitir aos poucos é mais que velocidade percebida. Ver a saída tomar forma deixa a pessoa julgar a direção cedo (e interromper cedo), transformando a geração de uma caixa-preta em um processo observável.","a":["Saídas que só fazem sentido quando completas (totais finais, veredictos)"],"u":["Texto, código e imagens gerados","Saídas longas que a pessoa pode querer redirecionar","Combinado com interrupção que aceita direcionamento"],"rd":["Building Effective Agents (Anthropic","Shape of AI) Emily Campbell"]},{"r":[{"n":"5.1","t":"Vislumbre do raciocínio"},{"n":"6.1","t":"Ancoragem em fontes e fundamentação"},{"n":"5.4","t":"Linha do tempo de atividades e log de auditoria"}],"d":"Sinais visíveis mostrando qual ferramenta ou fonte o agente está usando a cada momento.","s":"tool-usage-indicators","w":"Saber o método deixa a pessoa julgar a resposta. “Veio de uma busca na web” e “veio da memória” merecem ceticismos diferentes, e o uso visível de ferramentas ensina a capacidade de passagem.","c":"5","k":[],"e":["Os indicadores de “buscando na web…” em assistentes de chat","Os chips de fonte em respostas fundamentadas","Os rótulos de chamada de ferramenta nos logs de execução do agente"],"f":0,"t":"Indicadores de uso de ferramentas","n":"5.3","o":"Quando um agente busca na web, roda código ou lê um arquivo, a interface avisa. Os selos de ferramenta tornam legível a cadeia invisível por trás de uma resposta.","a":["Sobrecarregar cada resposta com uma bagunça de selos em tarefas de uma ferramenta só"],"u":["Agentes multiferramenta misturando fontes de confiabilidade variada","Contextos auditáveis e regulados","Descoberta de capacidade no início do uso"],"rd":["Building Effective Agents (Anthropic","Shape of AI) Emily Campbell"]},{"r":[{"n":"5.5","t":"Visão de progresso da execução"},{"n":"3.6","t":"Reversão e histórico de versões"},{"n":"10.1","t":"Painel de saúde da frota"}],"d":"Um registro cronológico e filtrável de tudo que o agente fez, com detalhe suficiente para reconstruir decisões.","s":"activity-timeline-and-audit-log","w":"A auditabilidade transforma o trabalho do agente de anedota em evidência. Ela sustenta a depuração, a resolução de disputas, a conformidade e a confiança para delegar mais.","c":"5","k":[],"e":["A linha do tempo de sessão do Devin","O histórico de tarefas do Zapier","Os logs de execução do GitHub Actions como precedente entre quem programa"],"f":0,"t":"Linha do tempo de atividades e log de auditoria","n":"5.4","o":"Confiança precisa de comprovante. A linha do tempo registra ações, entradas, saídas e aprovações, legível tanto para quem delegou quanto para a organização responsável pelo resultado.","a":["Despejos de log crus se passando por linhas do tempo para o usuário; a curadoria é o trabalho de design"],"u":["Ações autônomas em sistemas reais","Ambientes de time em que outras pessoas revisam o trabalho do agente","Setores presos a exigências de conformidade"],"rd":["Building Effective Agents (Anthropic","Shape of AI) Emily Campbell"]},{"r":[{"n":"3.3","t":"Planejar antes de executar"},{"n":"5.1","t":"Vislumbre do raciocínio"},{"n":"5.4","t":"Linha do tempo de atividades e log de auditoria"}],"d":"Um mapa ao vivo de uma tarefa multi-etapa: o que foi feito, o que está acontecendo, o que falta.","s":"execution-progress-view","w":"A estrutura visível transforma espera em monitoramento. A pessoa percebe travamentos e caminhos errados no meio da execução, quando intervir sai barato.","c":"5","k":[],"e":["As listas de tarefas em sessões de código com agentes","A visão de plano do Devin com o status das etapas ao vivo","As visões de estágio de pipelines de deploy"],"f":0,"t":"Visão de progresso da execução","n":"5.5","o":"Em tarefas longas, a pessoa precisa de consciência da situação, não só de um indicador de carregamento. A visão de progresso mostra o plano com o status de cada etapa (concluída, em execução, bloqueada) para o humano supervisionar num relance e intervir com precisão.","a":["Tarefas triviais, em que o aparato de progresso pesa mais que o trabalho"],"u":["Tarefas com três ou mais etapas relevantes","Trabalho em segundo plano que a pessoa acompanha de tempos em tempos","Passagens de bastão em que um colega retoma a supervisão"],"rd":["Building Effective Agents (Anthropic","Shape of AI) Emily Campbell"]},{"r":[{"n":"6.6","t":"Contraevidência"},{"n":"5.1","t":"Vislumbre do raciocínio"},{"n":"9.1","t":"Estados de falha segura"}],"d":"O agente revela proativamente atalhos, falhas e alegações não verificadas na própria saída.","s":"confessions-view","w":"Limitações confessadas custam menos que limitações descobertas. Cada confissão honesta gasta um pouco de orgulho para comprar credibilidade duradoura.","c":"5","k":[],"e":["As notas de “não consegui verificar…” em respostas fundamentadas","As admissões de falha de teste nos resumos de agentes de código","As ressalvas de cobertura nas saídas de ferramentas de pesquisa"],"f":0,"t":"Visão de confissões","n":"5.6","o":"A frase mais confiável que um agente pode produzir é “aqui está o que eu não consegui fazer”. As confissões trazem à tona etapas puladas, seções de baixa confiança e suposições não verificadas junto do resultado, antes que a pessoa as descubra do jeito difícil.","a":["Ressalvas reflexas em tudo; a confissão precisa ser específica para servir"],"u":["Pesquisa e análise com cobertura de fontes variável","Tarefas longas em que algumas etapas falharam em silêncio","Qualquer coisa sobre a qual a pessoa vai agir sem conferir por conta própria"],"rd":["Building Effective Agents (Anthropic","Shape of AI) Emily Campbell"]},{"r":[{"n":"6.2","t":"Termômetro de certeza"},{"n":"6.6","t":"Contraevidência"},{"n":"5.3","t":"Indicadores de uso de ferramentas"}],"d":"Cada alegação vincula-se à fonte de onde veio, inspecionável em um passo.","s":"source-anchoring-and-grounding","w":"As citações mudam a pergunta de confiança: em vez de \"será que acredito no agente\", a pessoa passa a se perguntar \"será que acredito nesta fonte\", algo que ela já sabe responder.","c":"6","k":[],"e":["As citações embutidas do Perplexity","As âncoras de fonte no nível do trecho no NotebookLM","Respostas com notas de rodapé em busca empresarial fundamentada"],"f":0,"t":"Ancoragem em fontes e fundamentação","n":"6.1","o":"A fluência sem lastro é a principal forma de falha dos sistemas generativos. A ancoragem prende cada afirmação a uma fonte citada, um documento, uma página, uma mensagem, de modo que verificar vira um clique, não uma investigação.","a":["Citações decorativas que não sustentam de verdade a alegação ancorada"],"u":["Resultados de pesquisa, jurídicos, médicos e financeiros","Respostas tiradas dos documentos da própria pessoa","Qualquer alegação que a pessoa vai repetir para outra"],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","People + AI Guidebook, Google PAIR"]},{"r":[{"n":"6.3","t":"Destaque semântico de incerteza"},{"n":"6.1","t":"Ancoragem em fontes e fundamentação"},{"n":"6.4","t":"Múltiplas opções apresentadas"}],"d":"Uma exibição graduada e legível de quão certo o agente está de uma saída.","s":"confidence-thermometer","w":"Com a certeza à vista, a pessoa distribui a atenção com eficiência: passa o olho no que está alto e confere o que está baixo. A calibração é tudo: um termômetro que marca alto o tempo todo é pior do que nenhum.","c":"6","k":[],"e":["A probabilidade na previsão do tempo como modelo mental","Faixas de certeza em campos extraídos de documentos por aprendizado de máquina","Indicadores de força de correspondência em busca e ferramentas de deduplicação"],"f":0,"t":"Termômetro de certeza","n":"6.2","o":"A certeza de tudo ou nada é uma mentira que a convenção de interface conta. O termômetro mostra a certeza como um espectro, alta, média ou baixa, calibrado para que o nível exibido realmente preveja o acerto.","a":["Mostrar notas não calibradas como se fossem probabilidades"],"u":["Extração e classificação com certeza mensurável","Saídas em lote em que a pessoa precisa priorizar a revisão","Apoio à decisão que alimenta o julgamento humano"],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","People + AI Guidebook, Google PAIR"]},{"r":[{"n":"6.2","t":"Termômetro de certeza"},{"n":"4.3","t":"Suposições confirmadas"},{"n":"5.6","t":"Visão de confissões"}],"d":"A dúvida aparece no trecho exato, não como uma nota geral que a pessoa aprende a ignorar.","s":"semantic-highlighting-of-uncertainty","w":"Mostrar a incerteza localmente deixa o esforço de revisão proporcional ao risco real. Também mantém o agente honesto no detalhe: ele não consegue esconder uma alegação frágil dentro de uma nota geral de \"certeza alta\".","c":"6","k":["Marque o trecho, não o documento","O que fica sem marca é uma promessa: cobre isso","Junte cada destaque a um caminho de correção em um toque","O peso visual deve sussurrar \"confira\", não gritar \"erro\""],"e":["Os sublinhados por trecho do Grammarly, conforme a certeza de cada questão","O destaque de campos de baixa certeza em interfaces de revisão de OCR e IA documental","As versões alternativas oferecidas em trechos incertos na tradução automática"],"f":1,"t":"Destaque semântico de incerteza","n":"6.3","o":"Uma nota de certeza no nível do documento responde a uma pergunta que ninguém fez. O que a pessoa precisa saber é onde mora a dúvida: qual data extraída, qual frase traduzida, qual cláusula. O destaque semântico marca os trechos incertos específicos, discreto no visual e preciso no sentido, para que o esforço de correção caia exatamente onde é preciso. Tudo que fica sem marca carrega uma garantia implícita; cada trecho destacado pede uma conferida pontual.","a":["Destacar tanta coisa que a marcação perde o sentido","Usar um visual alarmante que parece erro em vez de sinalização"],"u":["Extração e leitura de documentos (contratos, notas fiscais, formulários)","Saídas de tradução e transcrição","Qualquer saída estruturada que a pessoa confere campo a campo"],"rd":["Guidelines for Human-AI Interaction) Amershi et al., CHI 2019","People + AI Guidebook, Google PAIR"]},{"r":[{"n":"6.2","t":"Termômetro de certeza"},{"n":"2.6","t":"Controles de avaliação e retorno"},{"n":"4.1","t":"Perguntas de clarificação estruturadas"}],"d":"O agente oferece vários candidatos de saída em vez de uma única resposta.","s":"multiple-presented-options","w":"Escolher entre opções é mais fácil e mais certeiro do que avaliar uma resposta isolada, e a escolha ensina de graça as preferências da pessoa ao agente.","c":"6","k":[],"e":["As grades de quatro imagens nos geradores de imagem","Os painéis de várias sugestões em assistentes de código","As três respostas rápidas em chip no e-mail"],"f":0,"t":"Múltiplas opções apresentadas","n":"6.4","o":"Uma resposta só reivindica autoridade; vários candidatos convidam ao julgamento. Apresentar alternativas mostra o leque de possibilidades, entrega a decisão final à pessoa e protege contra um único palpite errado.","a":["Perguntas factuais com uma resposta certa, em que as opções criam dúvida falsa"],"u":["Saídas criativas e subjetivas","Pedidos ambíguos com várias leituras válidas","Fases de aprendizado de preferência"],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","People + AI Guidebook, Google PAIR"]},{"r":[{"n":"5.1","t":"Vislumbre do raciocínio"},{"n":"6.1","t":"Ancoragem em fontes e fundamentação"},{"n":"2.4","t":"Interfaces que ensinam"}],"d":"Qualquer saída pode ser questionada: por que isto? Aí vêm o raciocínio, as fontes e as compensações.","s":"explanation-on-demand","w":"A profundidade opcional serve tanto a quem confia quanto a quem desconfia, sem pesar para nenhum dos dois. A simples presença do recurso já dá segurança: a maioria nunca toca nele, mas todo mundo sabe que poderia.","c":"6","k":[],"e":["As justificativas do tipo \"porque você assistiu...\" nos recomendadores","Os códigos de motivo em decisões de crédito","Os pedidos de \"explique\" como acompanhamento em assistentes de chat"],"f":0,"t":"Explicação sob demanda","n":"6.5","o":"A explicação não deve ser imposta a cada resultado, nem ficar indisponível quando a pessoa quer. A explicação sob demanda mantém o padrão limpo e garante que o raciocínio por trás de qualquer saída está a um gesto de distância.","a":["Esconder avisos exigidos por lei atrás de um toque opcional"],"u":["Recomendações e rankings","Saídas surpreendentes ou contraintuitivas","Pessoas especialistas auditando o julgamento do agente"],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","People + AI Guidebook, Google PAIR"]},{"r":[{"n":"6.1","t":"Ancoragem em fontes e fundamentação"},{"n":"5.6","t":"Visão de confissões"},{"n":"6.2","t":"Termômetro de certeza"}],"d":"O agente expõe o que contradiz a própria resposta, não só o que a apoia.","s":"counter-evidence","w":"Um sistema que argumenta contra si mesmo conquista outro nível de confiança. A contraevidência protege a pessoa do viés de automação, a tendência de parar de pensar assim que a máquina fala.","c":"6","k":[],"e":["Os alertas de fonte conflitante em assistentes de pesquisa","A \"principal avaliação crítica\" mostrada ao lado dos elogios","Os modos de advogado do diabo em ferramentas de apoio à decisão"],"f":0,"t":"Contraevidência","n":"6.6","o":"Confirmação é fácil de produzir; equilíbrio precisa ser projetado. Este padrão obriga o agente a mostrar fontes discordantes, dados conflitantes e o argumento mais forte contra a própria conclusão.","a":["Fabricar equilíbrio falso quando a evidência é de fato de um lado só"],"u":["Decisões de peso (médicas, financeiras, jurídicas, de contratação)","Temas controversos com evidência genuinamente dividida","Fluxos de análise em que a conclusão é da pessoa"],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","People + AI Guidebook, Google PAIR"]},{"r":[{"n":"7.3","t":"Agente supervisor"},{"n":"7.5","t":"Quadros de atribuição e filas de trabalho"},{"n":"5.5","t":"Visão de progresso da execução"}],"d":"Um mapa visual dos agentes envolvidos numa tarefa e de como o trabalho flui entre eles.","s":"orchestration-graph","w":"Uma estrutura legível é a diferença entre um sistema e um jogo de adivinhação. A pessoa só supervisiona de verdade o trabalho de vários agentes quando enxerga o formato dele.","c":"7","k":[],"e":["Os canvas de fluxo no n8n e no Zapier","Os visualizadores de grafo de agentes em frameworks de orquestração","As visões de DAG de pipeline em ferramentas de dados"],"f":0,"t":"Grafo de orquestração","n":"7.1","o":"Quando um pedido se abre em muitos agentes, a pessoa perde o fio da meada. O grafo de orquestração mostra o elenco e a coreografia: qual agente faz o quê, o que depende de quê e em que pé está cada coisa.","a":["Produtos de um agente só, em que o grafo é enfeite"],"u":["Fluxos que passam por três ou mais agentes","Depuração de falhas entre vários agentes","Explicar o comportamento do sistema para as partes interessadas"],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"]},{"r":[{"n":"1.1","t":"Identidade e contrato de papel do agente"},{"n":"7.6","t":"Escalonamento e roteamento de contingência"},{"n":"10.3","t":"Níveis de acesso e permissão para agentes"}],"d":"Um diretório navegável dos agentes disponíveis: capacidades, permissões, histórico, responsáveis.","s":"agent-registry-and-profiles","w":"Descoberta com responsabilização. O registro transforma uma população opaca de agentes em um time com funções e responsáveis nomeados.","c":"7","k":[],"e":["Os perfis de capacidade da GPT Store","O diretório de apps do Slack com escopos e publicadores","Os catálogos internos de agentes em plataformas empresariais"],"f":0,"t":"Registro e perfis de agentes","n":"7.2","o":"Conforme os agentes se multiplicam, \"qual deles eu uso?\" vira uma pergunta de verdade. O registro responde com perfis estruturados: o que cada agente faz, o que pode acessar, como se saiu e quem o mantém.","a":["Um registro que ninguém cuida vira um cemitério que engana"],"u":["Organizações rodando muitos agentes especializados","Marketplaces de agentes de terceiros","Regimes de governança que exigem registro de responsáveis"],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"]},{"r":[{"n":"7.1","t":"Grafo de orquestração"},{"n":"7.4","t":"Briefings de transferência entre agentes"},{"n":"7.6","t":"Escalonamento e roteamento de contingência"}],"d":"Um agente coordenador que decompõe o trabalho, delega a especialistas e verifica a qualidade dos resultados.","s":"supervisor-agent","w":"A pessoa ganha simplicidade sem abrir mão de capacidade. O supervisor também concentra a responsabilidade: um agente responde pelo todo, por mais que muitos tenham contribuído.","c":"7","k":[],"e":["As arquiteturas de orquestrador e trabalhadores em frameworks de agentes","A delegação a subagentes em ferramentas de código agênticas","Os agentes gerentes em sistemas no estilo AutoGen"],"f":0,"t":"Agente supervisor","n":"7.3","o":"Um ponto de contato, muitas mãos. O padrão do supervisor dá à pessoa uma única interface de conversa enquanto agentes especialistas trabalham por trás, com o supervisor cuidando da divisão do trabalho, da ordem das etapas e da junção dos resultados.","a":["Domínios simples, em que um supervisor é só burocracia"],"u":["Tarefas complexas que abrangem competências distintas","Produtos que escondem a complexidade de vários agentes atrás de uma persona","Camadas de controle de qualidade sobre trabalho generativo"],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"]},{"r":[{"n":"7.3","t":"Agente supervisor"},{"n":"7.6","t":"Escalonamento e roteamento de contingência"},{"n":"8.4","t":"Repositório de contexto e perfis de espaço de trabalho"}],"d":"Passagem estruturada de contexto quando o trabalho muda de agente, ou de agente para humano.","s":"agent-handover-briefs","w":"A continuidade é o produto. A pessoa nunca deveria ter que explicar de novo a própria situação só porque o sistema trocou de trabalhador no meio da tarefa.","c":"7","k":[],"e":["As passagens de bot para humano com resumo da conversa em plataformas de atendimento","Os chamados de escalonamento preenchidos automaticamente com as etapas já tentadas","Os resumos de sessão ao retomar tarefas longas de agente"],"f":0,"t":"Briefings de transferência entre agentes","n":"7.4","o":"Toda passagem perde contexto, a menos que a interface lute por ele. O resumo de passagem reúne objetivo, situação atual, decisões tomadas, questões em aberto e restrições, para que quem recebe, máquina ou humano, já comece por dentro.","a":["Passagens triviais em que o resumo pesa mais que a tarefa"],"u":["Escalonamento de agente para humano","Tarefas longas que cruzam sessões ou agentes especializados","Fluxos de atendimento com equipe mista de bot e humano"],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"]},{"r":[{"n":"7.1","t":"Grafo de orquestração"},{"n":"5.5","t":"Visão de progresso da execução"},{"n":"10.1","t":"Painel de saúde da frota"}],"d":"Quadros compartilhados onde tarefas são visivelmente atribuídas a humanos e agentes.","s":"assignment-boards-and-work-queues","w":"Um quadro compartilhado normaliza a supervisão: perceber uma tarefa travada de agente funciona igual a perceber uma tarefa travada de pessoa. Sem sistema paralelo na sombra.","c":"7","k":[],"e":["Os bots como responsáveis em fluxos do Linear e do Jira","As tarefas do Copilot aparecendo nas filas de projeto","O roteamento de chamados que mistura agentes humanos e bots"],"f":0,"t":"Quadros de atribuição e filas de trabalho","n":"7.5","o":"Quando os agentes viram colegas de time, o lugar deles é no quadro do time. Este padrão encaixa o trabalho do agente nas mesmas filas, status e atribuições do trabalho humano, num único retrato operacional.","a":["Uso individual, em que uma lista de tarefas pessoal já basta"],"u":["Times com cargas recorrentes de trabalho delegado a agentes","Áreas de operações equilibrando capacidade humana e de agentes","Visibilidade da carga dos agentes para planejamento"],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"]},{"r":[{"n":"7.4","t":"Briefings de transferência entre agentes"},{"n":"9.2","t":"Fluxos guiados de reparo"},{"n":"6.2","t":"Termômetro de certeza"}],"d":"Transferência automática e graciosa para um humano ou um sistema mais forte quando o agente atinge seus limites.","s":"escalation-and-fallback-routing","w":"A rede de proteção determina o quanto a pessoa vai confiar na corda bamba. Um escalonamento conhecido e suave deixa a pessoa à vontade para começar pelo agente.","c":"7","k":[],"e":["O escalonamento de bot para atendente no Intercom e no Zendesk","As cadeias de contingência entre modelos em caso de recusa ou baixa certeza","Os recursos de \"falar com um humano\" que funcionam de verdade"],"f":0,"t":"Escalonamento e roteamento de contingência","n":"7.6","o":"A falha é inevitável; o beco sem saída é uma escolha. Este padrão define as saídas, para um humano, para um modelo mais capaz ou para um padrão mais seguro, acionadas quando a certeza despenca, quando a falha se repete ou quando a pessoa se frustra.","a":["Escalonamento que descarta o contexto em silêncio e recomeça a conversa"],"u":["Agentes voltados ao cliente com retaguarda humana","Arquiteturas de modelos em camadas equilibrando custo e capacidade","Detecção de frustração da pessoa ou de ciclos repetidos de falha"],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"]},{"r":[{"n":"8.5","t":"Perfis de contexto pessoal"},{"n":"8.3","t":"Controles de privacidade e uso de dados"},{"n":"8.2","t":"Preferências de persona"}],"d":"Um lugar para ver, corrigir e apagar tudo que o agente lembra sobre você.","s":"memory-inspector-and-editor","w":"Uma memória visível e editável transforma a personalização de invasiva em colaborativa. Quem pode podar a memória deixa mais dela crescer.","c":"8","k":[],"e":["A interface de gerenciar memórias do ChatGPT","As listas de preferências lembradas em assistentes de voz","Os gerenciadores de preferência de anúncios como referência falha"],"f":0,"t":"Inspetor e editor de memória","n":"8.1","o":"Memória sem inspeção é vigilância. O inspetor lista os fatos lembrados em linguagem clara, de onde cada um veio e o que ele afeta, com editar e apagar como ações de primeira classe.","a":["Despejos crus de embeddings passando por \"transparência de memória\""],"u":["Assistentes persistentes que acumulam fatos sobre a pessoa","Personalização cujos efeitos a pessoa percebe","Implantações sensíveis à privacidade"],"rd":["Microsoft HAX Toolkit","People + AI Guidebook, Google PAIR"]},{"r":[{"n":"8.1","t":"Inspetor e editor de memória"},{"n":"2.3","t":"Modos de revelação progressiva"},{"n":"1.2","t":"Modos de delegação"}],"d":"Configurações duráveis e explícitas de como o agente deve se comportar: tom, verbosidade, padrões, limites.","s":"preference-persona-settings","w":"Para a confiança, preferências explícitas ganham das inferidas: a pessoa escreveu a regra, então o comportamento soa como obediência, não como traçar um perfil.","c":"8","k":[],"e":["As instruções personalizadas do ChatGPT","Os presets de estilo em assistentes de escrita","Os arquivos de regras do agente por projeto em ferramentas de código"],"f":0,"t":"Preferências de persona","n":"8.2","o":"A pessoa não deveria discutir o estilo de novo a cada sessão. As preferências de persona guardam escolhas permanentes, direto ou detalhado, formal ou caloroso, sempre perguntar ou só fazer, aplicadas de forma consistente e substituíveis a cada tarefa.","a":["Excesso de configurações duplicando o que um pedido no contexto resolve melhor"],"u":["Assistentes de uso diário em tarefas variadas","Times padronizando o comportamento do agente","Necessidades de acessibilidade (nível de leitura, tamanho da resposta, formato)"],"rd":["Microsoft HAX Toolkit","People + AI Guidebook, Google PAIR"]},{"r":[{"n":"3.5","t":"Permissões com escopo e consentimento de ferramentas"},{"n":"8.1","t":"Inspetor e editor de memória"},{"n":"1.1","t":"Identidade e contrato de papel do agente"}],"d":"Controles claros e acionáveis sobre quais dados o agente acessa e como são usados, inclusive para treinamento.","s":"privacy-and-data-usage-controls","w":"A segurança sobre os dados é condição para o acesso profundo de que os agentes precisam para serem úteis. A opacidade limita o quanto a pessoa vai um dia conectar.","c":"8","k":[],"e":["As opções de ficar fora do treinamento nos controles de dados do ChatGPT","Os rótulos nutricionais de privacidade da Apple como referência de aviso","As permissões granulares de conectores em ferramentas de IA de espaço de trabalho"],"f":0,"t":"Controles de privacidade e uso de dados","n":"8.3","o":"A pergunta que a pessoa realmente faz, \"o que acontece com as minhas coisas?\", merece uma resposta de primeira classe. Este padrão junta um aviso em linguagem clara a controles de verdade: acesso por fonte, opção de ficar fora do treinamento, prazos de retenção e revogação em um toque.","a":["Teatro de consentimento: muros de texto com um único botão Aceitar"],"u":["Agentes que leem contas pessoais ou corporativas","Produtos que treinam com as interações das pessoas","Jurisdições com regimes de proteção de dados"],"rd":["Microsoft HAX Toolkit","People + AI Guidebook, Google PAIR"]},{"r":[{"n":"8.5","t":"Perfis de contexto pessoal"},{"n":"7.4","t":"Briefings de transferência entre agentes"},{"n":"3.7","t":"Uso de ferramentas dirigido pelo usuário"}],"d":"Contexto compartilhado e delimitado (arquivos, fatos, combinados) ligado a um projeto ou time, não a uma conversa.","s":"context-repository-and-workspace-profiles","w":"Delimitar o contexto por espaço de trabalho combina com a forma como o trabalho é de fato organizado e evita que o conhecimento pessoal, do projeto e da organização se misturem.","c":"8","k":[],"e":["Os Projects do Claude e do ChatGPT","O contexto de IA no nível do espaço de trabalho no Notion","Os arquivos de regras do repositório consumidos por agentes de código"],"f":0,"t":"Repositório de contexto e perfis de espaço de trabalho","n":"8.4","o":"Contexto que morre com a conversa é contexto que a pessoa precisa fornecer de novo o tempo todo. Os repositórios dão a ele uma casa durável: conhecimento do projeto, guias de estilo e documentos-chave, carregados automaticamente onde quer que aquele trabalho continue.","a":["Tarefas de uma conversa só, que não precisam de persistência"],"u":["Projetos longos com contexto acumulado","Times compartilhando um agente entre os membros","Consultores fazendo malabarismo com clientes cujos contextos não podem se misturar"],"rd":["Microsoft HAX Toolkit","People + AI Guidebook, Google PAIR"]},{"r":[{"n":"8.1","t":"Inspetor e editor de memória"},{"n":"8.2","t":"Preferências de persona"},{"n":"4.3","t":"Suposições confirmadas"}],"d":"O modelo de trabalho que o agente tem do usuário (papel, objetivos, situação) mantido aberto para inspeção e correção.","s":"personal-context-profiles","w":"Um modelo da pessoa que dá para inspecionar transforma a personalização de uma inferência feita sobre você em um perfil mantido com você. As correções melhoram o agente mais rápido do que qualquer sinal que ele conseguisse garimpar.","c":"8","k":[],"e":["Os perfis de interesse inferido abertos para edição (configurações de anúncio, bem feitas)","Os perfis de gosto em produtos de recomendação","A personalização por papel em fluxos de primeiros passos"],"f":0,"t":"Perfis de contexto pessoal","n":"8.5","o":"Todo agente que se adapta forma uma teoria sobre a pessoa. Este padrão deixa essa teoria explícita: \"é isso que eu acho que você é e o que está tentando fazer\", editável e ligada de forma visível a como o comportamento muda.","a":["Traços sensíveis inferidos que jamais deveriam ser modelados, muito menos exibidos"],"u":["Assistentes de relação longa que se adaptam à pessoa","Comportamento que depende do papel (fundadora, contador ou jurídico)","Fluxos de primeiros passos que inferem o contexto a partir de dados conectados"],"rd":["Microsoft HAX Toolkit","People + AI Guidebook, Google PAIR"]},{"r":[{"n":"3.6","t":"Reversão e histórico de versões"},{"n":"3.1","t":"Botão de parada, pausar e retomar"},{"n":"9.2","t":"Fluxos guiados de reparo"}],"d":"Quando o agente falha, falha sem estrago: trabalho preservado, sistemas intactos, caminho adiante claro.","s":"safe-failure-states","w":"O custo do pior dia do agente determina o quanto a pessoa arrisca nos dias comuns. Falha barata torna racional delegar com ousadia.","c":"9","k":[],"e":["A preservação de rascunho em caso de travamento nos editores maduros","As reversões transacionais que deixam os sistemas consistentes","Os agentes que param antes de passos destrutivos e reportam o estado"],"f":0,"t":"Estados de falha segura","n":"9.1","o":"Lidar com falha é arquitetura, não desculpa. Falha segura quer dizer trabalho parcial salvo, sistemas externos deixados consistentes, passos destrutivos preparados mas não efetivados, e a pessoa chegando em \"foi isto que aconteceu e é isto que você pode fazer\", nunca num beco sem saída.","a":["Estados de falha tão suaves que as falhas reais passam despercebidas"],"u":["Todo agente que age (este padrão é um piso, não um recurso)","Tarefas longas acumulando valor não salvo","Ações preparadas contra sistemas externos"],"rd":["People + AI Guidebook (Google PAIR (Errors + Graceful Failure)","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"]},{"r":[{"n":"9.1","t":"Estados de falha segura"},{"n":"2.6","t":"Controles de avaliação e retorno"},{"n":"4.2","t":"Edição da solicitação"}],"d":"Um caminho estruturado do erro do agente ao resultado corrigido, com o agente fazendo o trabalho pesado.","s":"guided-repair-flows","w":"O esforço de reparo decide se os erros são buracos na rua ou penhascos. Um ciclo de correção barato e confiável torna agentes imperfeitos perfeitamente usáveis.","c":"9","k":[],"e":["Os ciclos de \"corrigir com IA\" em código e testes que falham","Os fluxos de correção nas filas de revisão de extração de documentos","Os assistentes de resolução de conflito de merge como referência"],"f":0,"t":"Fluxos guiados de reparo","n":"9.2","o":"\"Está errado\" deveria começar um reparo, não um chamado de atendimento. O reparo guiado conduz a pessoa pelo diagnóstico, o que está errado, onde e de que tipo, depois propõe correções específicas, aplica a escolhida e confere o resultado.","a":["Revisão criativa livre, em que a conversa serve melhor que um assistente passo a passo"],"u":["Saídas estruturadas em que os erros são localizados e têm tipo","Modos de falha recorrentes que valem virar produto","Pessoas que reconhecem o errado mas não sabem especificar o certo"],"rd":["People + AI Guidebook (Google PAIR (Errors + Graceful Failure)","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"]},{"r":[{"n":"7.6","t":"Escalonamento e roteamento de contingência"},{"n":"9.4","t":"Pacote de desculpas e remediação"},{"n":"2.6","t":"Controles de avaliação e retorno"}],"d":"O agente lê a frustração e se adapta: mais curto, mais humilde, mais rápido para escalar.","s":"sentiment-aware-response-styles","w":"Desescalar preserva a relação através da falha. As mudanças de comportamento importam mais que o tom: quem está frustrado recebe concisão, opções e escalonamento, não teatro de solidariedade.","c":"9","k":[],"e":["Os modos de desescalada em bots de atendimento","O comportamento de repetição mais seco depois de várias correções","A passagem acelerada para um humano ao detectar frustração"],"f":0,"t":"Estilos de resposta sensíveis ao sentimento","n":"9.3","o":"Nada irrita tanto quanto uma alegria alheia depois da terceira falha. Este padrão ajusta o tom e o comportamento ao estado da pessoa, cortando os floreios, reconhecendo o erro e oferecendo a saída, sem fingir sentimentos que não tem.","a":["Intimidade emocional simulada, a adaptação precisa continuar honesta"],"u":["Falhas repetidas dentro de uma mesma sessão","Agentes voltados ao cliente em domínios emocionais","Momentos antes do abandono nervoso, perceptíveis nos sinais da interação"],"rd":["People + AI Guidebook (Google PAIR (Errors + Graceful Failure)","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"]},{"r":[{"n":"9.1","t":"Estados de falha segura"},{"n":"5.6","t":"Visão de confissões"},{"n":"9.3","t":"Estilos de resposta sensíveis ao sentimento"}],"d":"Após uma falha real: reconhecimento, explicação clara, correção concreta e o que evitará a repetição, como uma unidade.","s":"apology-and-remedy-bundle","w":"A pesquisa sobre recuperação de serviço é clara: falhas tratadas assim podem deixar mais confiança do que se nada tivesse dado errado. A pessoa não espera perfeição; espera que alguém assuma.","c":"9","k":[],"e":["Os postmortems em página de status: impacto, causa, prevenção","A recuperação proativa de serviço (reembolso antes da reclamação)","Os agentes que reportam a própria falha com opções de remediação"],"f":0,"t":"Pacote de desculpas e remediação","n":"9.4","o":"Desculpa sem remédio é relações públicas; correção sem reconhecimento é manipulação. O pacote entrega as quatro partes juntas, no tamanho do dano: um prazo perdido rende uma frase; um trabalho corrompido rende o tratamento completo.","a":["Pedir desculpa por reflexo a cada bobagem, o que barateia a moeda"],"u":["Falhas com custo real para a pessoa","Erros que a pessoa vai descobrir de qualquer jeito, chegue lá primeiro","Falhas recorrentes, em que a parte da prevenção é o ponto"],"rd":["People + AI Guidebook (Google PAIR (Errors + Graceful Failure)","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"]},{"r":[{"n":"5.4","t":"Linha do tempo de atividades e log de auditoria"},{"n":"10.2","t":"Mapas de calor de risco e políticas"},{"n":"7.5","t":"Quadros de atribuição e filas de trabalho"}],"d":"Visão da organização sobre todos os agentes em uso: atividade, desempenho, custo e anomalias.","s":"fleet-health-dashboard","w":"As organizações só delegam em escala quando alguém consegue responder \"os agentes estão bem?\" num relance. A observabilidade é o preço da autonomia de frota.","c":"10","k":[],"e":["As plataformas de observabilidade de LLM (rastros, avaliações, custo)","As análises de uso do Copilot para organizações","Os painéis de SRE como ancestral de design"],"f":0,"t":"Painel de saúde da frota","n":"10.1","o":"Dez agentes são um time; mil são infraestrutura. O painel da frota dá a quem opera a visão agregada, vazão, taxa de erro, gasto e desvio, com a opção de abrir o detalhe da anomalia até a sessão individual.","a":["Produtos individuais, em que uma página de uso já cobre"],"u":["Implantações empresariais além de um punhado de agentes","Governança de custo do uso de modelos","Detectar degradação e desvio cedo"],"rd":["Human-Centered AI (Ben Shneiderman","Building Effective Agents) Anthropic"]},{"r":[{"n":"10.1","t":"Painel de saúde da frota"},{"n":"10.3","t":"Níveis de acesso e permissão para agentes"},{"n":"3.5","t":"Permissões com escopo e consentimento de ferramentas"}],"d":"Uma sobreposição visual mostrando onde a atividade dos agentes toca dados, sistemas e decisões sensíveis.","s":"risk-and-policy-heatmaps","w":"Governança por mapa de calor substitui governança por anedota. O esforço de conformidade é distribuído pela exposição medida, não por quem gritou por último.","c":"10","k":[],"e":["Os painéis de postura de segurança em nuvem como referência","Os consoles de DLP mapeando fluxos de dados sensíveis","Os registros de risco de modelo em instituições financeiras"],"f":0,"t":"Mapas de calor de risco e políticas","n":"10.2","o":"Nem todo trabalho de agente carrega o mesmo risco. O mapa de calor cruza a atividade com a sensibilidade, quais agentes tocam dados pessoais, movimentam dinheiro ou atendem clientes, para que a atenção da supervisão caia onde a exposição de fato está.","a":["Startups com dois agentes e nenhuma superfície de conformidade, maquinário prematuro"],"u":["Setores regulados implantando agentes de forma ampla","Avaliações de risco antes de novas capacidades de agente","Preparação de auditoria e evidências"],"rd":["Human-Centered AI (Ben Shneiderman","Building Effective Agents) Anthropic"]},{"r":[{"n":"3.5","t":"Permissões com escopo e consentimento de ferramentas"},{"n":"10.2","t":"Mapas de calor de risco e políticas"},{"n":"7.2","t":"Registro e perfis de agentes"}],"d":"Níveis de capacidade baseados em papéis para agentes, espelhando como organizações já escalonam o acesso humano.","s":"access-and-permission-tiers-for-agents","w":"Trabalhar por níveis dá escala ao consentimento: em vez de auditar centenas de concessões de escopo individuais, a governança raciocina sobre um punhado de faixas bem definidas.","c":"10","k":[],"e":["Os papéis e políticas de IAM como ancestral direto","As políticas de IA empresarial que escalonam o acesso a ferramentas","Os lançamentos por etapa que liberam capacidade por grupo"],"f":0,"t":"Níveis de acesso e permissão para agentes","n":"10.3","o":"As organizações não dão as chaves de produção para estagiários; os agentes merecem a mesma disciplina. Os níveis agrupam escopos em faixas nomeadas, só leitura, colaborador, operador de confiança, com critérios de promoção e ciclos de revisão.","a":["Agentes individuais, em que permissões com escopo diretas já bastam"],"u":["Frotas de agentes com maturidade e raio de impacto variados","Promoção progressiva conforme os agentes provam confiabilidade","Mapear o acesso dos agentes às estruturas de IAM existentes"],"rd":["Human-Centered AI (Ben Shneiderman","Building Effective Agents) Anthropic"]},{"r":[{"n":"2.5","t":"Modelos de cenário e receitas"},{"n":"10.3","t":"Níveis de acesso e permissão para agentes"},{"n":"10.1","t":"Painel de saúde da frota"}],"d":"Uma biblioteca curada de fluxos e políticas de agentes aprovados, reutilizáveis por toda a organização.","s":"workflow-and-policy-template-library","w":"Os modelos tornam o caminho em conformidade o caminho fácil. Governança embutida em artefatos reutilizáveis escala; governança em documentos, não.","c":"10","k":[],"e":["Os módulos do Terraform como referência de governança como código","Os modelos de fluxo compartilhados em plataformas de automação","As bibliotecas empresariais de prompts e políticas"],"f":0,"t":"Biblioteca de modelos de fluxo e políticas","n":"10.4","o":"Cada time reinventando a governança de agentes produz, na melhor das hipóteses, inconsistência. A biblioteca empacota fluxos já avaliados, com permissões, portões e regras de escalonamento embutidos, como o caminho pavimentado que os times de fato querem seguir.","a":["Uma biblioteca sem dono apodrece e vira um risco"],"u":["Organizações com vários times padronizando a prática com agentes","Exigências de conformidade que precisam de aplicação consistente","Acelerar a adoção por novos times com segurança"],"rd":["Human-Centered AI (Ben Shneiderman","Building Effective Agents) Anthropic"]}]},"ui":{"en":{"lang":"en-US","sub":"A collection of best practices for products that act on their own, not just wait for a user's request. The patterns keep humans in charge, show what's happening, and recover when something fails.","all":"All patterns","searchPh":"Search patterns…","featured":"FEATURED","detail":"Pattern detail","ov":"Overview","why":"Why it works","use":"When to use it","avoid":"When to avoid it","ex":"Examples in the wild","take":"Takeaways","rel":"Related patterns","read":"Further reading","empty":"No patterns match. Try another term.","close":"Close","theme":"Toggle theme","f1":"Agentic UX Patterns © Rodrigo Mafra","f2":"CC BY-NC-ND 4.0 · Prototype","share":"Copy link","download":"Download markdown","copied":"Link copied","back":"Back to all","next":"Next","relatedCats":"Related categories","skip":"Skip to patterns","onPage":"On this page","prevPat":"Previous","nextPat":"Next pattern","contact":"Contact","license":"License","footNav":"Footer","contactName":"Name","contactEmail":"Email","contactSubject":"Subject","contactMessage":"Message","contactSend":"Send","contactSent":"Opening your email app to send this to Rodrigo.","contactNeed":"Please fill in name, email, subject, and message."},"pt":{"lang":"pt-BR","sub":"Uma coleção de boas práticas para produtos que agem sozinhos, não só esperam alguém pedir. Os padrões mantêm as pessoas no comando, mostram o que está acontecendo e ajudam a recuperar quando algo falha.","all":"Todos os padrões","searchPh":"Buscar padrões…","featured":"DESTAQUE","detail":"Detalhe do padrão","ov":"Visão geral","why":"Por que funciona","use":"Quando usar","avoid":"Quando evitar","ex":"Exemplos em produtos reais","take":"Para levar","rel":"Padrões relacionados","read":"Para ler depois","empty":"Nenhum padrão combina com essa busca. Tente outro termo.","close":"Fechar","theme":"Alternar tema","f1":"Agentic UX Patterns © Rodrigo Mafra","f2":"CC BY-NC-ND 4.0 · Protótipo","share":"Copiar link","download":"Baixar markdown","copied":"Link copiado","back":"Voltar para todos","next":"Próximo","relatedCats":"Categorias relacionadas","skip":"Ir para os padrões","onPage":"Nesta página","prevPat":"Anterior","nextPat":"Próximo padrão","contact":"Contato","license":"Licença","footNav":"Rodapé","contactName":"Nome","contactEmail":"E-mail","contactSubject":"Assunto","contactMessage":"Mensagem","contactSend":"Enviar","contactSent":"Abrindo seu aplicativo de e-mail para enviar ao Rodrigo.","contactNeed":"Preencha nome, e-mail, assunto e mensagem."}}};

    let lang = localStorage.getItem("aup-lang") || "en";
    let theme = localStorage.getItem("aup-theme") || "dark";
    let filter = "all", query = "";
    const $ = id => document.getElementById(id);

    const ICONS = {
      theme: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
