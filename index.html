<!DOCTYPE html>
<html lang="en-US" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Agentic UX Patterns</title>
  <meta name="description" content="49 design patterns for interfaces where the software acts on its own.">
  <style>
    :root {
      --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --s0: 4px; --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px;
      --s5: 40px; --s6: 48px; --s7: 64px; --s8: 80px;
      --t-xs: 0.75rem; --t-sm: 0.875rem; --t-base: 1rem; --t-md: 1.125rem;
      --t-lg: 1.25rem; --t-xl: 1.563rem; --t-2xl: 1.953rem; --t-3xl: 2.441rem; --t-4xl: 3.052rem;
      --sp: clamp(var(--s2), 4vw, var(--s4));
      --accent: #b9b7b0;
      --accent-tint: color-mix(in srgb, var(--accent) 16%, transparent);
      --accent-ink: var(--accent);
      --ratio: 1.25;
    }

    [data-theme="dark"] {
      --bg: #0e0f12;
      --bg2: #15161b;
      --card: #1a1b21;
      --line: #2a2c34;
      --ink: #f2f1ee;
      --ink2: #c4c2bb;
      --ink3: #8e8c85;
      --accent-ink: var(--accent);
      --overlay: rgba(10, 10, 13, .66);
      color-scheme: dark;
    }

    [data-theme="light"] {
      --bg: #faf9f6;
      --bg2: #f1efe9;
      --card: #ffffff;
      --line: #e3e0d6;
      --ink: #17181c;
      --ink2: #3f3e3a;
      --ink3: #6f6d66;
      --accent-ink: color-mix(in srgb, var(--accent) 44%, #17181c);
      --overlay: color-mix(in srgb, var(--ink) 38%, transparent);
      color-scheme: light;
    }

    * { margin: 0; padding: 0; box-sizing: border-box }

    html { scroll-behavior: smooth; scrollbar-gutter: stable }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: var(--t-base);
      line-height: 1.55;
      transition: background .3s, color .3s
    }

    a { color: inherit }
    button { font-family: inherit }
    h1, h2, .psec-open, .card-open, .hero h2 { overflow-wrap: break-word }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); clip-path: inset(50%);
      white-space: nowrap; border: 0
    }
    .skip {
      position: absolute;
      left: var(--sp);
      top: calc(var(--s1) + env(safe-area-inset-top));
      z-index: 30;
      background: var(--ink); color: var(--bg);
      border-radius: 999px; padding: var(--s1) 14px;
      min-height: 44px; display: inline-flex; align-items: center;
      text-decoration: none; font-size: var(--t-sm);
      transform: translateY(-160%)
    }
    .skip:focus { transform: none }

    .wrap { max-width: 1200px; margin: 0 auto; padding-inline: var(--sp) }

    .icon {
      width: 18px; height: 18px; display: block; flex-shrink: 0;
      stroke: currentColor; fill: none; stroke-width: 1.5;
      stroke-linecap: round; stroke-linejoin: round
    }
    .icon.sm { width: 16px; height: 16px }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--s1);
      position: relative;
      z-index: 2;
      padding-top: calc(var(--s2) + env(safe-area-inset-top));
      --topbar-h: calc(40px + var(--s2) + env(safe-area-inset-top))
    }
    .topbar-end { display: flex; align-items: center; gap: 6px; margin-left: auto }
    #backBtn[hidden] { display: none !important }

    .tbtn {
      border: 1px solid var(--line);
      background: var(--bg2);
      color: var(--ink2);
      border-radius: 999px;
      padding: var(--s1) 14px;
      font-size: var(--t-sm);
      cursor: pointer;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      gap: var(--s1)
    }

    .tbtn:hover, .tbtn:focus-visible { color: var(--ink); border-color: var(--ink3) }
    .tbtn.on { background: var(--ink); color: var(--bg); border-color: var(--ink) }
    .tbtn.icon-only { padding: var(--s1); width: 40px; justify-content: center }

    header.hero-h {
      position: relative;
      padding: clamp(var(--s4), 7vw, var(--s8)) 0 var(--s5);
      overflow: hidden
    }
    header.hero-h .hero-inner { position: relative; z-index: 1 }
    .motif-bg { display: none }
    header.hero-h.cat-on {
      margin-top: calc(-1 * (40px + var(--s2) + env(safe-area-inset-top)));
      padding: calc(40px + var(--s2) + env(safe-area-inset-top) + clamp(var(--s3), 4vw, var(--s5))) 0 var(--s4);
      background: var(--illu-field, var(--bg));
      color: #f2eee2
    }
    header.hero-h.cat-on .hero-inner {
      display: grid;
      grid-template-columns: 1fr minmax(180px, 400px);
      gap: var(--s4);
      align-items: center
    }
    header.hero-h.cat-on .motif-bg {
      display: grid; place-items: center;
      aspect-ratio: 1; width: 100%; max-width: 400px; justify-self: end;
      background: none; border-radius: 0; overflow: visible
    }
    header.hero-h.cat-on .motif-bg svg {
      width: 224px; height: 224px; display: block
    }
    header.hero-h.cat-on h1 {
      font-size: clamp(var(--t-2xl), 5vw, var(--t-4xl));
      color: #f2eee2
    }
    header.hero-h.cat-on .sub { color: color-mix(in srgb, #f2eee2 86%, transparent) }
    header.hero-h.cat-on .lead-blurb { color: color-mix(in srgb, #f2eee2 72%, transparent) }
    @media (max-width: 720px) {
      header.hero-h.cat-on .hero-inner { grid-template-columns: 1fr }
      header.hero-h.cat-on .motif-bg { justify-self: stretch; max-width: none }
    }

    h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(var(--t-3xl), 7vw, 4.5rem);
      line-height: 1.04;
      letter-spacing: -.015em;
      text-wrap: balance
    }

    .sub {
      margin-top: var(--s2);
      font-size: clamp(var(--t-base), 2.4vw, var(--t-md));
      color: var(--ink2);
      max-width: 40rem;
      text-wrap: pretty
    }

    nav.filters {
      position: sticky; top: 0;
      background: linear-gradient(var(--bg) 78%, transparent);
      padding: var(--s2) 0 var(--s2);
      z-index: 5
    }

    .search { position: relative; max-width: 420px }
    .search .icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--ink3); pointer-events: none
    }
    .search input {
      width: 100%; background: var(--bg2); border: 1px solid var(--line);
      border-radius: 12px; color: var(--ink);
      padding: 12px 16px 12px 42px; font-size: 16px; min-height: 44px
    }
    .search input:focus-visible { border-color: var(--ink3) }

    main { padding: var(--s3) 0 var(--s8) }
    .grid-wrap { container-type: inline-size }
    .wrap.grid-wrap.has-rail {
      max-width: none;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(168px, 220px) minmax(0, 48rem) minmax(0, 1fr);
      column-gap: var(--s4);
      align-items: start;
      padding-inline: var(--s2)
    }
    .wrap.grid-wrap.has-rail .sec-nav { grid-column: 1; grid-row: 1 }
    .wrap.grid-wrap.has-rail .sections { grid-column: 2; grid-row: 1 }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
      gap: var(--s2)
    }
    .sections { display: flex; flex-direction: column; gap: 0; max-width: 48rem }
    .sec-nav {
      position: sticky;
      top: var(--s3);
      align-self: start;
      padding: 0;
      border: 0;
      margin: 0;
      max-height: calc(100dvh - var(--s6));
      overflow-y: auto
    }
    .sec-nav[hidden] { display: none !important }
    .sec-nav ol { list-style: none; display: flex; flex-direction: column; gap: 2px }
    .sec-nav a {
      color: var(--ink3); text-decoration: none; font-size: 13px; line-height: 1.35;
      min-height: 44px; display: flex; align-items: center;
      padding: 10px 10px 10px 12px;
      border-left: 2px solid transparent;
      border-radius: 0 6px 6px 0
    }
    .sec-nav a:hover, .sec-nav a:focus-visible { color: var(--ink); background: var(--bg2) }
    .sec-nav a.on {
      color: var(--ink); border-left-color: var(--ink);
      background: color-mix(in srgb, var(--bg2) 80%, transparent)
    }
    @media (max-width: 800px) {
      .wrap.grid-wrap.has-rail {
        grid-template-columns: 1fr;
        padding-inline: var(--sp)
      }
      .wrap.grid-wrap.has-rail .sec-nav,
      .wrap.grid-wrap.has-rail .sections { grid-column: 1; grid-row: auto }
      .sec-nav { position: static; max-height: none; margin-bottom: var(--s3) }
      .sec-nav ol { flex-direction: row; flex-wrap: wrap; gap: 4px }
      .sec-nav a { border-left: 0; border-radius: 8px; background: var(--bg2) }
    }
    .psec {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: var(--s3);
      padding: var(--s5) 0;
      scroll-margin-top: 24px
    }
    .psec-thumb {
      width: 48px; height: 48px;
      overflow: hidden;
      background: none;
      --thumb-mark: #F2EEE2;
      --thumb-rule: #0D0D0D
    }
    [data-theme="dark"] .psec-thumb {
      --thumb-mark: color-mix(in srgb, var(--ink) 62%, transparent);
      --thumb-rule: var(--ink)
    }
    .psec-thumb svg { width: 48px; height: 48px; display: block }
    .psec-copy h2 { margin: 0 0 10px }
    .psec-open {
      font: inherit; font-family: var(--serif);
      font-size: clamp(var(--t-lg), 2.6vw, var(--t-xl));
      font-weight: 600; line-height: 1.2; text-wrap: balance;
      color: var(--ink); background: none; border: 0; padding: 0;
      cursor: pointer; text-align: left; min-height: 44px
    }
    .psec-open:hover, .psec-open:focus-visible { color: var(--accent-ink) }
    .psec-copy > p { font-size: 15.5px; color: var(--ink2); text-wrap: pretty; margin-bottom: 10px }
    @media (max-width: 560px) {
      .psec { grid-template-columns: 40px 1fr; gap: var(--s2) }
      .psec-thumb { width: 40px; height: 40px }
      .psec-thumb svg { width: 40px; height: 40px }
    }

    .catq {
      display: inherit; grid-column: 1/-1;
      margin: var(--s4) 0 var(--s1);
      font-family: var(--serif);
      font-size: clamp(var(--t-lg), 3vw, var(--t-xl));
      color: var(--ink2); text-wrap: balance
    }
    .catq:first-child { margin-top: var(--s1) }
    .catq b { color: var(--ink); font-weight: 600 }
    .catq span { color: var(--ink3); font-size: var(--t-sm); font-family: var(--sans) }
    @container (max-width: 480px) {
      .catq span { display: block; margin: var(--s0) 0 0 }
    }

    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 0; cursor: pointer;
      transition: transform .15s, border-color .15s;
      position: relative; overflow: hidden;
      display: flex; flex-direction: column;
      min-width: 0;
      content-visibility: auto; contain-intrinsic-size: auto 520px
    }
    .card .band {
      height: 260px; display: grid; place-items: center;
      background: var(--illu-field, var(--card));
      overflow: hidden
    }
    .card .band svg { width: 224px; height: 224px; display: block }
    .card .body { padding: var(--s3) 22px var(--s3); display: flex; flex-direction: column; gap: 10px; flex: 1 }
    .card-open {
      font: inherit; font-family: var(--serif);
      font-size: inherit; font-weight: inherit; line-height: inherit;
      text-wrap: inherit; color: inherit;
      background: none; border: 0; padding: 0;
      cursor: pointer; text-align: left; min-height: 44px
    }
    .card-open::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1
    }
    @media (hover: hover) {
      .card:hover { transform: translateY(-3px); border-color: var(--ink3) }
    }
    .card:has(.card-open:focus-visible) {
      border-color: var(--ink3);
      outline: 2px solid var(--ink3);
      outline-offset: 4px
    }
    .card-open:focus-visible { outline: none }
    .card h2, .card h3 {
      font-family: var(--serif);
      font-size: clamp(var(--t-lg), 2.6vw, var(--t-xl));
      font-weight: 600; line-height: 1.2; text-wrap: balance
    }
    .card p { font-size: 14.5px; color: var(--ink2); text-wrap: pretty }
    .card .blurb {
      font-size: 13.5px; color: var(--ink3); line-height: 1.45;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
      overflow: hidden
    }
    .lead-blurb {
      margin-top: var(--s2); max-width: 36rem;
      font-size: clamp(var(--t-sm), 2vw, var(--t-base));
      color: var(--ink3); line-height: 1.5; text-wrap: pretty
    }
    .lead-blurb[hidden] { display: none !important }
    .card .feat, .psec .feat {
      align-self: flex-start;
      font-size: 10.5px; letter-spacing: .14em; color: var(--bg);
      background: var(--accent); border-radius: 999px; padding: 3px 9px; font-weight: 700
    }
    [data-theme="light"] .card .feat, [data-theme="light"] .psec .feat { color: var(--ink) }

    dialog {
      border: none; padding: 0; background: transparent;
      max-width: none; max-height: none; width: 100%; height: 100dvh;
      overflow-y: auto; overscroll-behavior: contain
    }
    dialog::backdrop { background: var(--overlay); backdrop-filter: blur(6px) }

    .sheet {
      max-width: 760px; margin: 6vh auto 8vh;
      background: var(--bg2); border: 1px solid var(--line);
      border-radius: 22px; overflow: hidden
    }
    @starting-style {
      dialog[open] .sheet { opacity: 0; transform: translateY(24px) }
    }
    dialog[open] .sheet {
      opacity: 1; transform: none;
      transition: opacity .28s ease, transform .28s ease
    }

    .hero {
      padding: 0; position: relative;
      background: var(--card)
    }
    .hero .motif {
      aspect-ratio: 16 / 9;
      max-height: 280px;
      display: grid;
      place-items: center;
      background: var(--illu-field, var(--bg));
      overflow: hidden;
      border-bottom: 1px solid var(--line)
    }
    .hero .motif .plate {
      height: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden
    }
    .hero .motif .plate svg { width: 100%; height: 100%; display: block }
    .hero .hero-copy {
      padding: clamp(var(--s3), 5vw, var(--s5)) clamp(22px, 5vw, 48px) var(--s5)
    }
    .hero h2 {
      font-family: var(--serif);
      font-size: clamp(var(--t-2xl), 5.5vw, var(--t-4xl));
      font-weight: 600; line-height: 1.12; text-wrap: balance
    }
    .hero .cat {
      margin-top: 14px; font-size: 12.5px; letter-spacing: .13em;
      text-transform: uppercase; color: var(--ink3)
    }
    .hero .cat i { font-style: normal; color: var(--accent-ink) }
    .hero .def {
      margin-top: 18px; font-size: clamp(16.5px, 2.6vw, 19px);
      color: var(--ink2); font-family: var(--serif); line-height: 1.5; text-wrap: pretty
    }

    .hero-actions {
      position: absolute; top: 16px; right: 16px;
      display: flex; gap: var(--s1); z-index: 2
    }
    .icon-btn {
      background: color-mix(in srgb, var(--bg2) 88%, transparent);
      backdrop-filter: blur(6px);
      border: 1px solid var(--line); color: var(--ink2);
      width: 42px; height: 42px; border-radius: 50%;
      cursor: pointer; display: grid; place-items: center
    }
    .icon-btn:hover, .icon-btn:focus-visible { color: var(--ink); border-color: var(--ink3) }
    .toast {
      position: absolute; top: 64px; right: 16px; z-index: 3;
      background: var(--ink); color: var(--bg); font-size: var(--t-xs);
      padding: 6px 10px; border-radius: 8px; opacity: 0; pointer-events: none;
      transition: opacity .2s
    }
    .toast.show { opacity: 1 }

    .dbody { padding: clamp(26px, 5vw, 38px) clamp(22px, 5vw, 48px) clamp(40px, 6vw, 52px) }
    .dbody h3 {
      font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--accent-ink); margin: 30px 0 12px
    }
    .dbody h3:first-child { margin-top: 0 }
    .dbody p { color: var(--ink2); font-size: 16px; text-wrap: pretty }
    .dbody ul { list-style: none }
    .dbody li {
      color: var(--ink2); font-size: 15.5px; padding: 8px 0 8px 22px;
      position: relative; border-bottom: 1px solid var(--line)
    }
    .dbody li:last-child { border-bottom: none }
    .dbody li::before { content: ", "; position: absolute; left: 0; color: var(--accent-ink) }

    .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 32px }
    .rel { display: flex; flex-wrap: wrap; gap: var(--s1) }
    .rel button {
      border: 1px solid var(--line); background: transparent; border-radius: 999px;
      padding: 8px 14px; font-size: 13.5px; color: var(--ink2); cursor: pointer; min-height: 44px
    }
    .rel button:hover, .rel button:focus-visible { color: var(--ink); border-color: var(--ink3) }

    .take {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 18px 20px; margin-top: 8px
    }

    footer {
      border-top: 1px solid var(--line);
      padding: var(--s4) 0 calc(var(--s6) + env(safe-area-inset-bottom));
      color: var(--ink3); font-size: var(--t-sm)
    }
    footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; align-items: center }
    .foot-links {
      display: flex; align-items: center; gap: 8px;
      margin-left: auto
    }
    .foot-links a, .foot-links button {
      color: inherit; background: none; border: 0; padding: 0;
      font: inherit; cursor: pointer; text-decoration: none;
      min-height: 44px; display: inline-flex; align-items: center; gap: 6px
    }
    .foot-links .icon { width: 14px; height: 14px }
    .foot-links a:hover, .foot-links button:hover,
    .foot-links a:focus-visible, .foot-links button:focus-visible { color: var(--ink) }
    .foot-links .sep { pointer-events: none }

    .contact-sheet { max-width: 520px; margin: 8vh auto }
    .contact-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--s2); padding: var(--s3) var(--s3) 0
    }
    .contact-head h2 {
      font-family: var(--serif); font-weight: 600;
      font-size: clamp(var(--t-xl), 4vw, var(--t-2xl));
      line-height: 1.15
    }
    .contact-form {
      display: flex; flex-direction: column; gap: 10px;
      padding: var(--s3) var(--s3) var(--s4)
    }
    .contact-form label { font-size: var(--t-sm); color: var(--ink2) }
    .contact-form input, .contact-form textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--line);
      border-radius: 12px; color: var(--ink); font: inherit; font-size: 16px;
      padding: 12px 16px; min-height: 44px
    }
    .contact-form textarea { min-height: 8rem; resize: vertical; line-height: 1.5 }
    .contact-form input:focus-visible, .contact-form textarea:focus-visible {
      border-color: var(--ink3)
    }
    .contact-form .tbtn { align-self: flex-start; margin-top: var(--s1) }
    .contact-form .tbtn:disabled { opacity: .55; cursor: default }
    .contact-status { min-height: 1.35em; color: var(--ink2); font-size: var(--t-sm) }

    .empty { grid-column: 1/-1; color: var(--ink3); padding: var(--s5) 0; font-size: var(--t-base) }

    .related { margin-top: var(--s8) }
    .related h2, .next-cat .next-label {
      font-size: var(--t-sm); letter-spacing: .12em; text-transform: uppercase;
      color: var(--ink3); font-weight: 600; font-family: var(--sans)
    }
    .related h2 { margin-bottom: var(--s3) }
    .next-cat {
      display: block; margin-top: var(--s7); padding: var(--s5) 0;
      border-top: 1px solid var(--line); text-decoration: none; color: inherit;
      min-height: 40px
    }
    .next-cat[hidden], .related[hidden] { display: none !important }
    .next-cat .next-label { display: block; margin-bottom: var(--s1) }
    .next-cat strong {
      font-family: var(--serif); font-size: clamp(var(--t-xl), 4vw, var(--t-3xl));
      font-weight: 600; line-height: 1.15
    }
    .next-cat:hover strong, .next-cat:focus-visible strong { color: var(--accent-ink) }
    .next-cat:focus-visible { outline: 2px solid var(--ink3); outline-offset: 4px }

    @media (max-width:640px) {
      .sheet { margin: auto 0 0; max-width: none; border-radius: 24px 24px 0 0; min-height: 60dvh }
      dialog[open] { display: flex; flex-direction: column }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important }
      html { scroll-behavior: auto }
    }
    @media (prefers-reduced-transparency: reduce) {
      dialog::backdrop, .icon-btn { backdrop-filter: none }
    }
    .tbtn:focus-visible,
    .icon-btn:focus-visible,
    .search input:focus-visible,
    .sec-nav a:focus-visible,
    .psec-open:focus-visible,
    .rel button:focus-visible,
    .skip:focus-visible,
    .foot-links a:focus-visible,
    .foot-links button:focus-visible,

  <script>
    const DB = {"en":{"cats":{"1":{"name":"Identity & Delegation","q":"What is this agent allowed to be?","hex":"#f59e0b","b":"Name the agent, its job, and its limits. Then let people choose how much to hand over."},"2":{"name":"Learning & Onboarding","q":"How do people learn what an agent can do?","hex":"#34d399","b":"Help people learn the range before they trust it. Playgrounds, guides, and templates beat a long manual."},"3":{"name":"Control & Steering","q":"How do people stay in charge?","hex":"#f87171","b":"Pause, steer, approve, and undo. The person stays in charge while work is underway."},"4":{"name":"Clarification","q":"What happens when it doesn't know enough?","hex":"#f472b6","b":"When facts are missing, the agent asks in a structured way instead of guessing."},"5":{"name":"Transparency of Process","q":"What is it doing right now?","hex":"#38bdf8","b":"Show the plan, the current step, and what already ran. No black box mid-task."},"6":{"name":"Transparency of Confidence","q":"How sure is it, and why?","hex":"#a3e635","b":"Show how sure the answer is, and why. Mark guesses so they do not look like facts."},"7":{"name":"Multi-Agent Systems","q":"What happens when there's more than one?","hex":"#a78bfa","b":"When more than one agent is in play, make roles, handoffs, and ownership obvious."},"8":{"name":"Memory & Context","q":"What does it know about me?","hex":"#22d3ee","b":"What it remembers about you, where that lives, and how you inspect or limit it."},"9":{"name":"Failure & Repair","q":"What happens when it gets it wrong?","hex":"#fb923c","b":"Make failure visible, explain the miss, and give a path to repair without starting over."},"10":{"name":"Governance & Oversight","q":"How does an organisation supervise a fleet?","hex":"#818cf8","b":"Policy, access, and audit for a fleet. Supervision that scales past a single chat."}},"patterns":[{"n":"1.1","t":"Agent identity & role contract","d":"An explicit, inspectable statement of what an agent is, what it is for, and the boundaries of its mandate.","c":"1","o":"Before a person can delegate anything, they need to know who they are delegating to. This pattern gives every agent a visible contract: its purpose, its capabilities, its limits, and what it will never do. The contract is a promise the interface keeps.","w":"Trust begins with predictability. A stated mandate lets users calibrate expectations before the first interaction, and gives them grounds to object when the agent drifts outside it.","u":["Introducing a new agent to users for the first time","Products where one agent among several must be distinguishable","Regulated domains where scope must be documented"],"a":["Purely reactive single-purpose tools where scope is self-evident"],"e":["Custom GPT instruction summaries shown before first use","Slack app profiles listing granted scopes and capabilities","Claude's stated constitution and usage policies"],"r":[{"n":"1.2","t":"Delegation modes"},{"n":"3.5","t":"Scoped permissions & tool consent"},{"n":"8.3","t":"Privacy & data usage controls"}],"f":0,"k":[],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","Microsoft HAX Toolkit"],"s":"agent-identity-and-role-contract"},{"n":"1.2","t":"Delegation modes","d":"Distinct, user-selectable levels of autonomy, from suggest-only to fully autonomous execution.","c":"1","o":"Autonomy is not a switch, it is a dial. This pattern exposes discrete, well-labelled modes (suggest, ask-before-acting, act-and-report) so users choose how much control to hand over per task, per context, or per agent.","w":"People trust systems whose autonomy they chose. Graduated modes let cautious users start low and ratchet up as the agent proves itself, instead of forcing an all-or-nothing bet.","u":["Agents whose actions have real-world consequences","Onboarding journeys where trust must be earned progressively","Power users and novices sharing one product"],"a":["Trivial actions where mode selection adds more friction than the action itself"],"e":["GitHub Copilot's spectrum from ghost-text suggestions to autonomous agent mode","Cursor's ask / edit / agent modes","Driver-assistance levels as the canonical mental model"],"r":[{"n":"1.1","t":"Agent identity & role contract"},{"n":"3.2","t":"Human-in-the-loop gates"},{"n":"3.3","t":"Plan-then-execute workflow"}],"f":0,"k":[],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","Microsoft HAX Toolkit"],"s":"delegation-modes"},{"n":"2.1","t":"Sandboxed playgrounds","d":"A consequence-free environment where users can try an agent's capabilities before granting real access.","c":"2","o":"Nobody hands car keys to a stranger. Sandboxes let users watch the agent work on sample data, simulated accounts, or reversible copies, building an accurate mental model before anything real is at stake.","w":"Direct experience beats documentation. A safe rehearsal converts abstract capability claims into observed behaviour, which is how humans actually calibrate trust.","u":["High-stakes domains (money, legal, production systems)","Capability-rich agents users underestimate or overestimate","Sales and onboarding moments"],"a":["When the sandbox behaves differently enough from production to teach the wrong model"],"e":["Stripe test mode as the archetype","OpenAI Playground for model behaviour","Demo workspaces in analytics and CRM products"],"r":[{"n":"2.5","t":"Scenario templates & recipes"},{"n":"3.6","t":"Rollback & version history"},{"n":"9.1","t":"Safe failure states"}],"f":0,"k":[],"rd":["People + AI Guidebook (Google PAIR","Shape of AI) Emily Campbell"],"s":"sandboxed-playgrounds"},{"n":"2.2","t":"Wayfinders","d":"Contextual cues and suggestions that reveal what the agent could do next, inside the flow of work.","c":"2","o":"Blank-canvas agents fail because capability is invisible. Wayfinders surface timely, situation-aware suggestions, not a manual, but signposts placed exactly where the user already is.","w":"Discovery in context costs nothing; discovery in documentation costs a trip nobody takes. Suggestion chips double as capability disclosure.","u":["Conversational interfaces with broad, invisible capability","First-run and empty states","Moments after a completed task, to chain the next one"],"a":["Interruptive suggestions during focused work, wayfinding must never become advertising"],"e":["ChatGPT's suggested prompts on new chats","Notion AI's contextual command menu","Gmail's contextual nudges (follow up, reply suggestions)"],"r":[{"n":"2.3","t":"Progressive disclosure modes"},{"n":"2.5","t":"Scenario templates & recipes"},{"n":"4.1","t":"Structured clarification prompts"}],"f":0,"k":[],"rd":["People + AI Guidebook (Google PAIR","Shape of AI) Emily Campbell"],"s":"wayfinders"},{"n":"2.3","t":"Progressive disclosure modes","d":"Advanced autonomy and capability revealed gradually, matched to the user's demonstrated skill and trust.","c":"2","o":"The full power of an agent on day one is noise. This pattern sequences capability: simple assistance first, deeper autonomy unlocked as usage signals readiness, mirroring how responsibility is granted to a new colleague.","w":"Cognitive load stays manageable and trust grows on evidence. Users who never need the advanced tier never pay its complexity tax.","u":["Feature-rich agents serving mixed skill levels","Autonomy that is dangerous in untrained hands","Long-lived products where relationships deepen"],"a":["Expert tools where gating frustrates users who arrive skilled"],"e":["Copilot features rolling out behind usage milestones","Advanced settings hidden behind progressive menus","Gradual autonomy unlocks in finance apps"],"r":[{"n":"1.2","t":"Delegation modes"},{"n":"2.2","t":"Wayfinders"},{"n":"8.2","t":"Preference persona settings"}],"f":0,"k":[],"rd":["People + AI Guidebook (Google PAIR","Shape of AI) Emily Campbell"],"s":"progressive-disclosure-modes"},{"n":"2.4","t":"Teach-me interfaces","d":"The agent demonstrates and explains how to work with it, turning instruction into interaction.","c":"2","o":"Instead of shipping a manual, the agent is the manual. It walks users through its own capabilities with live examples, explains why an approach worked, and coaches better delegation over time.","w":"People learn tools by using them with a guide. An agent that teaches its own operation compresses time-to-competence and reduces abandoned first sessions.","u":["Novel interaction paradigms with no inherited conventions","Complex capability that rewards skilled prompting","Re-onboarding after major capability changes"],"a":["When teaching moments interrupt rather than serve the current task"],"e":["Duolingo Max explaining answers rather than just marking them","Interactive product tours driven by real user data","Copilot explaining a suggested change on request"],"r":[{"n":"2.2","t":"Wayfinders"},{"n":"6.5","t":"Explanation on demand"},{"n":"2.6","t":"Feedback & rating controls"}],"f":0,"k":[],"rd":["People + AI Guidebook (Google PAIR","Shape of AI) Emily Campbell"],"s":"teach-me-interfaces"},{"n":"2.5","t":"Scenario templates & recipes","d":"Pre-built, editable starting workflows that encode what the agent does well.","c":"2","o":"A template is a capability claim you can run. Recipes package proven multi-step workflows (inputs, steps, expected outputs) so users start from working examples instead of blank prompts.","w":"Templates transfer expertise from the few who explore to the many who adopt. They also constrain early use to paths the agent handles reliably.","u":["Broad agents whose best uses are non-obvious","Team settings where workflows should be shared","Reducing variance in output quality"],"a":["When templates ossify into the only ways users ever engage"],"e":["Zapier's AI workflow templates","The GPT Store as a recipe marketplace","Notion template gallery applied to AI workflows"],"r":[{"n":"2.1","t":"Sandboxed playgrounds"},{"n":"2.2","t":"Wayfinders"},{"n":"10.4","t":"Workflow & policy template library"}],"f":0,"k":[],"rd":["People + AI Guidebook (Google PAIR","Shape of AI) Emily Campbell"],"s":"scenario-templates-and-recipes"},{"n":"2.6","t":"Feedback & rating controls","d":"Lightweight in-flow mechanisms for users to grade agent output, feeding visible improvement.","c":"2","o":"Thumbs, stars, accept/reject, the signal matters less than the loop. This pattern captures judgement at the moment of use and, critically, shows users that their feedback changed something.","w":"Feedback that visibly improves behaviour converts users from consumers into trainers, deepening investment. Silent feedback boxes teach people to stop bothering.","u":["Any generative output a user can judge instantly","Systems that personalise per user or per team","Early-stage products hunting failure modes"],"a":["High-friction surveys where a one-tap signal would do"],"e":["ChatGPT response ratings","Copilot's accept/dismiss as implicit signal","Midjourney's image ranking feeding model preferences"],"r":[{"n":"2.4","t":"Teach-me interfaces"},{"n":"8.2","t":"Preference persona settings"},{"n":"9.2","t":"Guided repair flows"}],"f":0,"k":[],"rd":["People + AI Guidebook (Google PAIR","Shape of AI) Emily Campbell"],"s":"feedback-and-rating-controls"},{"n":"3.1","t":"Kill switch, pause & resume","d":"An always-available control to halt an agent instantly, without losing the work in progress.","c":"3","o":"The most important button in agentic UX is stop. This pattern guarantees interruption is immediate, lossless, and reversible: pause preserves state, resume continues, stop abandons cleanly.","w":"Knowing you can stop is what makes starting safe. Recoverable interruption removes the fear cost of delegation, so users grant more autonomy overall.","u":["Every autonomous execution longer than a moment","Actions with mounting cost or consequence","Agents operating on live external systems"],"a":["Never omit it, the anti-pattern is its absence"],"e":["Stop-generating controls in every major chat product","Devin's pause and redirect mid-run","CI/CD pipeline cancellation as prior art"],"r":[{"n":"3.4","t":"Steerability & polite interruption"},{"n":"3.6","t":"Rollback & version history"},{"n":"9.1","t":"Safe failure states"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"],"s":"kill-switch-pause-and-resume"},{"n":"3.2","t":"Human-in-the-loop gates","d":"Checkpoints where the agent must pause and obtain explicit approval before proceeding, placed by consequence, not by habit.","c":"3","o":"Not every action needs approval; approving everything is just a slower manual product. HITL gates are deliberate checkpoints positioned where consequence and irreversibility are high, sending the email, moving the money, deleting the data. Below the gate line, the agent acts freely. Above it, a human decides. The gate itself must be informative: a pre-action brief covering what the agent wants to do, why, on what evidence, and what happens next, never a bare Confirm/Cancel that trains blind clicking.","w":"Gates convert autonomy from a leap of faith into a supervised handover. Placed well, they concentrate human attention exactly where it is irreplaceable; placed lazily, they create approval fatigue that defeats their purpose.","u":["Irreversible or costly actions (payments, sends, deletions, contracts)","First occurrences of a new action class, before trust is established","Regulated workflows requiring documented consent"],"a":["Routine, reversible actions, gate fatigue teaches users to stop reading","As a liability shield without genuine decision content"],"e":["Claude Code's permission prompts before running commands or editing files","Deployment approval steps in GitHub Actions and release pipelines","Payment confirmation with biometric step-up in banking apps","Devin's plan approval before autonomous execution"],"r":[{"n":"3.3","t":"Plan-then-execute workflow"},{"n":"1.2","t":"Delegation modes"},{"n":"5.1","t":"Reasoning glimpse"}],"f":1,"k":["Place gates by consequence and reversibility, not uniformly","Make every gate a brief: what, why, evidence, what happens next","Tier approvals (first-time actions gate, proven routines flow","Measure gate fatigue: approval-without-reading is a design failure"],"rd":["Building Effective Agents) Anthropic","Human-Centered AI, Ben Shneiderman"],"s":"human-in-the-loop-gates"},{"n":"3.3","t":"Plan-then-execute workflow","d":"The agent proposes a complete plan for review before any action is taken.","c":"3","o":"Instead of acting step by step into the unknown, the agent thinks first and shows its work: a structured plan the user can approve, edit, or reject. Execution begins only after the human has seen the shape of what is coming.","w":"A plan is the cheapest possible place to catch a misunderstanding. Reviewing intent costs seconds; reversing execution can cost hours, or be impossible.","u":["Multi-step tasks touching real systems","Ambiguous requests where interpretation should be verified","Expensive operations (compute, money, other people's time)"],"a":["Quick single-step tasks where planning theatre slows everything down"],"e":["Claude Code's plan mode","Devin's editable task plan before running","Copilot Workspace's spec-and-plan flow before code changes"],"r":[{"n":"3.2","t":"Human-in-the-loop gates"},{"n":"4.3","t":"Confirmed assumptions"},{"n":"5.5","t":"Execution progress view"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"],"s":"plan-then-execute-workflow"},{"n":"3.4","t":"Steerability & polite interruption","d":"Users can redirect a running agent mid-task without cancelling and starting over.","c":"3","o":"Delegation is a conversation, not a contract signing. This pattern lets users interject (refine the goal, correct course, add constraints) while the agent gracefully incorporates the change and continues.","w":"Course corrections are cheaper than restarts. Systems that punish interruption with lost work teach users to under-delegate.","u":["Long-running generative or research tasks","Iterative creative work where goals sharpen mid-flight","Voice interfaces, where interruption is natural"],"a":["Atomic transactions that genuinely cannot absorb mid-flight change"],"e":["Follow-up steering in Cursor and Claude Code while agents work","Interrupting a voice assistant mid-answer","Editing a running prompt in modern chat UIs"],"r":[{"n":"3.1","t":"Kill switch, pause & resume"},{"n":"4.2","t":"Edit request"},{"n":"5.5","t":"Execution progress view"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"],"s":"steerability-and-polite-interruption"},{"n":"3.5","t":"Scoped permissions & tool consent","d":"Granular, revocable grants controlling which tools, data, and actions an agent may use.","c":"3","o":"All-or-nothing access is how trust dies. This pattern decomposes agent capability into inspectable scopes (read calendar, send email, spend up to X) granted individually, revocable instantly, and visible in one place.","w":"Granularity lets users say yes to the useful parts without underwriting the dangerous ones. Every scope granted is a considered decision, not a surrender.","u":["Agents connecting to external accounts and APIs","Financial or destructive capability","Enterprise deployment with compliance requirements"],"a":["Fragmenting scopes so finely that consent becomes noise"],"e":["OAuth scope consent screens","iOS per-capability app permissions","Claude's per-tool permission model"],"r":[{"n":"1.1","t":"Agent identity & role contract"},{"n":"3.2","t":"Human-in-the-loop gates"},{"n":"10.3","t":"Access & permission tiers for agents"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"],"s":"scoped-permissions-and-tool-consent"},{"n":"3.6","t":"Rollback & version history","d":"Every agent action is recorded and reversible; state can be restored to any prior point.","c":"3","o":"Undo is the foundation of fearless use. Extended to agents, it means a browsable history of what changed, when, by whom (human or agent) with one-step restoration.","w":"Reversibility converts risk into experiment. Users who know they can roll back delegate earlier, grant more, and panic less when something looks wrong.","u":["Agents that modify documents, code, or configuration","Batch operations across many items","Anywhere 'undo' would exist for a human doing the same work"],"a":["Genuinely irreversible external actions, which is exactly where HITL gates belong instead"],"e":["Git as the deep prior art","Figma and Notion version history","Checkpoint restore in agentic coding tools"],"r":[{"n":"3.1","t":"Kill switch, pause & resume"},{"n":"9.1","t":"Safe failure states"},{"n":"5.4","t":"Activity timeline & audit log"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"],"s":"rollback-and-version-history"},{"n":"3.7","t":"User-directed tool use","d":"Users choose which tools, sources, and output modes the agent may employ for a task.","c":"3","o":"Sometimes the human knows best how the job should be done. This pattern exposes the agent's toolbox (search the web or not, use this dataset, produce a table not prose) as explicit, per-task controls.","w":"Constraining method is a form of steering that prevents whole classes of error before they happen, and teaches users what the agent's tools actually are.","u":["Research tasks where source quality matters","Outputs destined for specific downstream formats","Users with hard constraints (privacy, cost, compliance)"],"a":["Defaulting to manual tool selection for users who just want the outcome"],"e":["Perplexity's focus and source selectors","Tool toggles (web, code, canvas) in ChatGPT","Model and context pickers in agentic IDEs"],"r":[{"n":"3.5","t":"Scoped permissions & tool consent"},{"n":"6.1","t":"Source anchoring & grounding"},{"n":"8.4","t":"Context repository & workspace profiles"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"],"s":"user-directed-tool-use"},{"n":"4.1","t":"Structured clarification prompts","d":"When the agent needs input, it asks with concrete options rather than open-ended questions.","c":"4","o":"'What do you mean?' stalls the work. Structured clarification presents the ambiguity as choices (interpreted meanings, scoped options, sensible defaults) so resolving it takes one tap, not one paragraph.","w":"Options reveal what the agent considered, teach its reasoning, and lower response effort to near zero. Open questions transfer the whole cognitive burden back to the user.","u":["Ambiguity with a small set of plausible readings","Mobile and voice contexts where typing is costly","Repeated decision points that deserve remembered defaults"],"a":["Genuinely open creative direction, where options would anchor too early"],"e":["Multiple-choice clarifying questions in agentic coding tools","Slot-filling chips in travel and booking flows","Disambiguation prompts in search"],"r":[{"n":"4.2","t":"Edit request"},{"n":"4.3","t":"Confirmed assumptions"},{"n":"2.2","t":"Wayfinders"}],"f":0,"k":[],"rd":["People + AI Guidebook (Google PAIR","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"],"s":"structured-clarification-prompts"},{"n":"4.2","t":"Edit request","d":"The agent shows its interpretation of the request and lets the user amend it directly.","c":"4","o":"Between what was said and what was understood lies most agent failure. This pattern externalises the interpretation (a rewritten brief, an expanded prompt) as an editable artifact before or after execution.","w":"Correcting a misreading at the interpretation layer is surgical; correcting it through conversational back-and-forth is archaeology.","u":["Complex briefs with embedded constraints","Systems that rewrite or expand user prompts internally","Recurring tasks whose briefs deserve refinement over time"],"a":["Trivial requests where showing interpretation is pure overhead"],"e":["Image generators exposing their revised prompts","Search engines' 'showing results for…' with override","Editable task specs in Copilot Workspace"],"r":[{"n":"4.1","t":"Structured clarification prompts"},{"n":"4.3","t":"Confirmed assumptions"},{"n":"3.4","t":"Steerability & polite interruption"}],"f":0,"k":[],"rd":["People + AI Guidebook (Google PAIR","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"],"s":"edit-request"},{"n":"4.3","t":"Confirmed assumptions","d":"The agent states the assumptions it is proceeding on, giving users a chance to correct them without blocking.","c":"4","o":"Silent assumptions are landmines; blocking questions are speed bumps. The middle path: declare assumptions inline ('Assuming Q3 means calendar Q3') and proceed, unless the user objects.","w":"Work continues at full speed while every assumption remains visible and correctable. Errors surface at the moment of divergence instead of at delivery.","u":["Ambiguity with one strongly probable reading","Time-sensitive tasks where blocking is costly","Long tasks where assumptions compound"],"a":["High-stakes forks where a wrong assumption is expensive (ask instead"],"e":["Stated defaults in booking flows ('economy, 1 adult) change?')","Agents noting interpretation choices in their working output","Auto-detected settings with visible override"],"r":[{"n":"4.1","t":"Structured clarification prompts"},{"n":"4.2","t":"Edit request"},{"n":"3.3","t":"Plan-then-execute workflow"}],"f":0,"k":[],"rd":["People + AI Guidebook (Google PAIR","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"],"s":"confirmed-assumptions"},{"n":"5.1","t":"Reasoning glimpse","d":"A brief, honest window into what the agent is doing and why, enough to establish real work, without exposing the machinery.","c":"5","o":"An agent that goes silent and returns an answer asks for blind faith. An agent that narrates every internal step is exhausting, and usually theatre. The reasoning glimpse sits deliberately between: short, task-specific status lines that tell the user what kind of work is happening ('Reading the contract… extracting payment terms… checking dates') and summarised reasoning available at a glance. The test of honesty is specificity: cues generated from the actual work read as reporting; generic cues read as a spinner in costume.","w":"Perceived competence tracks visible process. People trust outcomes more when they witness credible effort, but only if the display is truthful; decorative 'thinking' animations erode trust the first time they are caught lying.","u":["Tasks longer than a few seconds, where silence reads as failure","Complex analysis whose value users cannot judge from the answer alone","Building early trust in a new agent relationship"],"a":["Faking process signals that do not correspond to real work","Streaming raw chain-of-thought that overwhelms more than it informs"],"e":["Summarised thinking in reasoning models (OpenAI o-series, Claude's extended thinking)","Perplexity's live step display: searching, reading sources, composing","Tool-call narration in agentic IDEs (searching codebase, running tests)"],"r":[{"n":"5.3","t":"Tool usage indicators"},{"n":"5.5","t":"Execution progress view"},{"n":"6.5","t":"Explanation on demand"}],"f":1,"k":["Make cues task-specific (generated from real work, never canned","Show the kind of work, not the full transcript","Match cue granularity to task length and stakes","Honesty is the constraint: a glimpse that lies is worse than silence"],"rd":["Building Effective Agents) Anthropic","Shape of AI, Emily Campbell"],"s":"reasoning-glimpse"},{"n":"5.2","t":"Streaming results visualizations","d":"Output renders progressively as it is produced, making pace and direction visible.","c":"5","o":"Streaming is more than perceived speed. Watching output form lets users judge direction early (and interrupt early) turning generation from a black box into an observable process.","w":"Early visibility enables early correction, and progressive rendering keeps engagement through waits that a blank screen would lose.","u":["Generative text, code, and imagery","Long-form outputs users may want to redirect","Paired with steerable interruption"],"a":["Outputs only meaningful when complete (final totals, verdicts)"],"e":["Token streaming across chat products","Midjourney's progressive image resolve","Live-updating result tables in research agents"],"r":[{"n":"5.1","t":"Reasoning glimpse"},{"n":"3.4","t":"Steerability & polite interruption"},{"n":"5.5","t":"Execution progress view"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Shape of AI) Emily Campbell"],"s":"streaming-results-visualizations"},{"n":"5.3","t":"Tool usage indicators","d":"Visible signals showing which tool or source the agent is using at each moment.","c":"5","o":"When an agent searches the web, runs code, or reads a file, the interface says so. Tool badges make the invisible supply chain of an answer legible.","w":"Knowing the method lets users judge the answer. 'From a web search' and 'from memory' warrant different scepticism, and visible tool use teaches capability in passing.","u":["Multi-tool agents mixing sources of varying reliability","Auditable and regulated contexts","Capability discovery in early use"],"a":["Overloading every response with badge clutter for single-tool tasks"],"e":["'Searching the web…' indicators in chat assistants","Source chips on grounded answers","Tool-call labels in agent execution logs"],"r":[{"n":"5.1","t":"Reasoning glimpse"},{"n":"6.1","t":"Source anchoring & grounding"},{"n":"5.4","t":"Activity timeline & audit log"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Shape of AI) Emily Campbell"],"s":"tool-usage-indicators"},{"n":"5.4","t":"Activity timeline & audit log","d":"A chronological, filterable record of everything the agent did, with enough detail to reconstruct decisions.","c":"5","o":"Trust needs receipts. The timeline records actions, inputs, outputs, and approvals, readable by the user who delegated and by the organisation accountable for the result.","w":"Auditability converts agent work from anecdote into evidence. It powers debugging, dispute resolution, compliance, and the confidence to delegate more.","u":["Autonomous actions on real systems","Team environments where others review agent work","Compliance-bound industries"],"a":["Raw log dumps posing as user-facing timelines, curation is the design work"],"e":["Devin's session timeline","Zapier task history","GitHub Actions run logs as developer prior art"],"r":[{"n":"5.5","t":"Execution progress view"},{"n":"3.6","t":"Rollback & version history"},{"n":"10.1","t":"Fleet health dashboard"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Shape of AI) Emily Campbell"],"s":"activity-timeline-and-audit-log"},{"n":"5.5","t":"Execution progress view","d":"A live map of a multi-step task: what is done, what is happening, what remains.","c":"5","o":"For long tasks, users need situational awareness, not just a spinner. The progress view shows the plan with per-step status (complete, running, blocked) so the human can supervise at a glance and intervene precisely.","w":"Visible structure turns waiting into monitoring. Users spot stalls and wrong turns mid-run, when intervention is cheap.","u":["Tasks with three or more meaningful steps","Background work users check on periodically","Handoffs where a colleague resumes supervision"],"a":["Trivial tasks where a progress apparatus outweighs the work"],"e":["Task checklists in agentic coding sessions","Devin's plan view with live step status","Deployment pipeline stage views"],"r":[{"n":"3.3","t":"Plan-then-execute workflow"},{"n":"5.1","t":"Reasoning glimpse"},{"n":"5.4","t":"Activity timeline & audit log"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Shape of AI) Emily Campbell"],"s":"execution-progress-view"},{"n":"5.6","t":"Confessions view","d":"The agent proactively discloses shortcuts, failures, and unverified claims in its own output.","c":"5","o":"The most trustworthy sentence an agent can produce is 'here is what I could not do.' Confessions surface skipped steps, low-confidence sections, and unverified assumptions alongside the result, before the user finds them the hard way.","w":"Self-reported limitations are cheaper than discovered ones. Every honest confession spends a little pride to buy durable credibility.","u":["Research and analysis with variable source coverage","Long tasks where some steps quietly failed","Anything a user will act on without independent checking"],"a":["Reflexive hedging on everything, confession must be specific to be useful"],"e":["'I couldn't verify…' notes on grounded answers","Test-failure admissions in coding agent summaries","Coverage caveats in research tool outputs"],"r":[{"n":"6.6","t":"Counter-evidence"},{"n":"5.1","t":"Reasoning glimpse"},{"n":"9.1","t":"Safe failure states"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Shape of AI) Emily Campbell"],"s":"confessions-view"},{"n":"6.1","t":"Source anchoring & grounding","d":"Every claim links to the source it came from, inspectable in one step.","c":"6","o":"Ungrounded fluency is the core failure mode of generative systems. Anchoring pins each assertion to a citation (document, page, message) so verification is a click, not an investigation.","w":"Citations shift the trust question from 'do I believe the agent' to 'do I believe the source', a question humans already know how to answer.","u":["Research, legal, medical, financial outputs","Answers derived from user documents","Any claim a user will repeat to someone else"],"a":["Decorative citations that do not actually support the anchored claim"],"e":["Perplexity's inline citations","NotebookLM's passage-level source anchors","Footnoted answers in grounded enterprise search"],"r":[{"n":"6.2","t":"Confidence thermometer"},{"n":"6.6","t":"Counter-evidence"},{"n":"5.3","t":"Tool usage indicators"}],"f":0,"k":[],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","People + AI Guidebook, Google PAIR"],"s":"source-anchoring-and-grounding"},{"n":"6.2","t":"Confidence thermometer","d":"A graded, glanceable display of how certain the agent is about a given output.","c":"6","o":"Binary certainty is a lie told by interface convention. The thermometer renders confidence as a spectrum (high, moderate, low) calibrated so the displayed level actually predicts accuracy.","w":"Users allocate scrutiny efficiently when confidence is visible: skim the high, verify the low. Calibration is everything, a thermometer that always reads high is worse than none.","u":["Extraction and classification with measurable confidence","Batch outputs where users must prioritise review","Decision support feeding human judgement"],"a":["Displaying uncalibrated scores as if they were probabilities"],"e":["Probability framing in weather forecasts as the mental model","Confidence bands on ML-extracted document fields","Match-strength indicators in search and dedupe tools"],"r":[{"n":"6.3","t":"Semantic highlighting of uncertainty"},{"n":"6.1","t":"Source anchoring & grounding"},{"n":"6.4","t":"Multiple presented options"}],"f":0,"k":[],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","People + AI Guidebook, Google PAIR"],"s":"confidence-thermometer"},{"n":"6.3","t":"Semantic highlighting of uncertainty","d":"Uncertainty is marked locally, on the exact span the agent is unsure about, not as a global score users learn to ignore.","c":"6","o":"A document-level confidence score answers a question nobody asked. What users need to know is where the doubt lives: which extracted date, which translated phrase, which clause. Semantic highlighting marks the specific uncertain spans (visually quiet, semantically precise) so correction effort lands exactly where it is needed. Everything unmarked carries an implicit warranty; the highlighted spans invite one targeted look each.","w":"Local uncertainty display makes review effort proportional to actual risk. It also keeps the agent honest at a granular level: it cannot hide a shaky claim inside an overall 'high confidence' rating.","u":["Document extraction and parsing (contracts, invoices, forms)","Translation and transcription outputs","Any structured output a human confirms field by field"],"a":["Highlighting so much that the marking loses meaning","Using alarming visual treatments that read as errors rather than flags"],"e":["Grammarly's span-level underlines by issue confidence","Low-confidence field highlighting in OCR and document-AI review UIs","Alternative renderings offered on uncertain phrases in machine translation"],"r":[{"n":"6.2","t":"Confidence thermometer"},{"n":"4.3","t":"Confirmed assumptions"},{"n":"5.6","t":"Confessions view"}],"f":1,"k":["Mark the span, not the document","Unmarked content is a promise (police it","Pair every highlight with a one-tap correction path","Visual weight should whisper 'check this', not shout 'error'"],"rd":["Guidelines for Human-AI Interaction) Amershi et al., CHI 2019","People + AI Guidebook, Google PAIR"],"s":"semantic-highlighting-of-uncertainty"},{"n":"6.4","t":"Multiple presented options","d":"The agent offers several candidate outputs instead of a single answer.","c":"6","o":"One answer claims authority; several candidates invite judgement. Presenting alternatives shows the space of possibility, hands the final call to the human, and hedges against a single wrong guess.","w":"Choosing among options is easier and more accurate than evaluating one answer in isolation, and selection data teaches the agent user preferences for free.","u":["Creative and subjective outputs","Ambiguous requests with several valid readings","Preference learning phases"],"a":["Factual questions with one right answer, options manufacture false doubt"],"e":["Four-image grids in image generators","Multiple suggestion panels in code assistants","Three-chip smart replies in email"],"r":[{"n":"6.2","t":"Confidence thermometer"},{"n":"2.6","t":"Feedback & rating controls"},{"n":"4.1","t":"Structured clarification prompts"}],"f":0,"k":[],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","People + AI Guidebook, Google PAIR"],"s":"multiple-presented-options"},{"n":"6.5","t":"Explanation on demand","d":"Any output can be interrogated: 'why this?' produces the reasoning, sources, and trade-offs behind it.","c":"6","o":"Explanations shouldn't be forced on every result, and shouldn't be unavailable when wanted. On-demand explanation keeps the default clean while guaranteeing that the reasoning behind any output is one gesture away.","w":"Optional depth serves both the trusting and the sceptical without taxing either. The affordance's mere presence builds confidence, most users never tap it, but everyone knows they could.","u":["Recommendations and rankings","Surprising or counterintuitive outputs","Expert users auditing agent judgement"],"a":["Burying legally required disclosures behind an optional tap"],"e":["'Because you watched…' rationales in recommenders","Reason codes in credit decisions","Ask-to-explain follow-ups in chat assistants"],"r":[{"n":"5.1","t":"Reasoning glimpse"},{"n":"6.1","t":"Source anchoring & grounding"},{"n":"2.4","t":"Teach-me interfaces"}],"f":0,"k":[],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","People + AI Guidebook, Google PAIR"],"s":"explanation-on-demand"},{"n":"6.6","t":"Counter-evidence","d":"The agent surfaces what contradicts its own answer, not just what supports it.","c":"6","o":"Confirmation is easy to generate; balance has to be designed. This pattern obliges the agent to show dissenting sources, conflicting data, and the strongest case against its conclusion.","w":"A system that argues against itself earns a different order of trust. Counter-evidence inoculates users against automation bias, the tendency to stop thinking once the machine has spoken.","u":["Consequential decisions (medical, financial, legal, hiring)","Contested topics with genuinely mixed evidence","Analyst workflows where the user owns the conclusion"],"a":["Manufacturing false balance where evidence is genuinely one-sided"],"e":["Conflicting-source flags in research assistants","'Top critical review' surfaced beside praise","Devil's-advocate modes in decision-support tools"],"r":[{"n":"6.1","t":"Source anchoring & grounding"},{"n":"5.6","t":"Confessions view"},{"n":"6.2","t":"Confidence thermometer"}],"f":0,"k":[],"rd":["Guidelines for Human-AI Interaction, Amershi et al., CHI 2019","People + AI Guidebook, Google PAIR"],"s":"counter-evidence"},{"n":"7.1","t":"Orchestration graph","d":"A visual map of the agents involved in a task and how work flows between them.","c":"7","o":"When one request fans out to many agents, users lose the plot. The orchestration graph shows the cast and the choreography: which agent does what, what depends on what, where things stand.","w":"Legible structure is the difference between a system and a séance. Users supervise multi-agent work meaningfully only when they can see its shape.","u":["Workflows spanning three or more agents","Debugging multi-agent failures","Explaining system behaviour to stakeholders"],"a":["Single-agent products, where a graph is decoration"],"e":["Workflow canvases in n8n and Zapier","Agent-graph visualisers in orchestration frameworks","Pipeline DAG views in data tooling"],"r":[{"n":"7.3","t":"Supervisor agent"},{"n":"7.5","t":"Assignment boards & work queues"},{"n":"5.5","t":"Execution progress view"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"],"s":"orchestration-graph"},{"n":"7.2","t":"Agent registry & profiles","d":"A browsable directory of available agents: capabilities, permissions, track record, ownership.","c":"7","o":"As agents multiply, 'which one do I use?' becomes a real question. The registry answers it with structured profiles, what each agent does, what it may access, how it has performed, who maintains it.","w":"Discoverability plus accountability. A registry turns an opaque agent population into a staffed team with named responsibilities.","u":["Organisations running many specialised agents","Marketplaces of third-party agents","Governance regimes requiring ownership records"],"a":["A registry nobody curates becomes a graveyard that misleads"],"e":["The GPT Store's capability profiles","Slack app directory with scopes and publishers","Internal agent catalogues in enterprise platforms"],"r":[{"n":"1.1","t":"Agent identity & role contract"},{"n":"7.6","t":"Escalation & fallback routing"},{"n":"10.3","t":"Access & permission tiers for agents"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"],"s":"agent-registry-and-profiles"},{"n":"7.3","t":"Supervisor agent","d":"A coordinating agent that decomposes work, delegates to specialists, and quality-checks results.","c":"7","o":"One point of contact, many hands. The supervisor pattern gives users a single conversational interface while specialist agents work behind it, with the supervisor owning decomposition, sequencing, and integration of results.","w":"Users get simplicity without sacrificing capability. The supervisor also concentrates accountability: one agent answers for the whole, however many contributed.","u":["Complex tasks spanning distinct competencies","Products hiding multi-agent complexity behind one persona","Quality-control layers over generative work"],"a":["Simple domains where a supervisor is bureaucracy"],"e":["Orchestrator-worker architectures in agent frameworks","Subagent delegation in agentic coding tools","Manager agents in AutoGen-style systems"],"r":[{"n":"7.1","t":"Orchestration graph"},{"n":"7.4","t":"Agent handover briefs"},{"n":"7.6","t":"Escalation & fallback routing"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"],"s":"supervisor-agent"},{"n":"7.4","t":"Agent handover briefs","d":"Structured context transfer when work passes between agents, or from agent to human.","c":"7","o":"Every handover leaks context unless the interface fights for it. The brief packages goal, state, decisions made, open questions, and constraints so the receiver (silicon or human) starts warm.","w":"Continuity is the product. Users should never re-explain their situation because the system changed workers mid-task.","u":["Agent-to-human escalation","Long tasks crossing sessions or specialised agents","Support flows with mixed bot and human staffing"],"a":["Trivial handoffs where a brief outweighs the task"],"e":["Bot-to-human handoffs with conversation summaries in support platforms","Escalation tickets auto-populated with attempted steps","Session summaries when resuming long agent tasks"],"r":[{"n":"7.3","t":"Supervisor agent"},{"n":"7.6","t":"Escalation & fallback routing"},{"n":"8.4","t":"Context repository & workspace profiles"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"],"s":"agent-handover-briefs"},{"n":"7.5","t":"Assignment boards & work queues","d":"Shared boards where tasks are visibly assigned across humans and agents alike.","c":"7","o":"When agents become teammates, they belong on the team board. This pattern slots agent work into the same queues, statuses, and assignments as human work, one operational picture.","w":"A shared board normalises supervision: spotting a stuck agent task works exactly like spotting a stuck human one. No parallel shadow system.","u":["Teams with recurring delegated agent workloads","Ops functions balancing human and agent capacity","Visibility of agent workload for planning"],"a":["Solo use, where a personal task list suffices"],"e":["Bots as assignees in Linear and Jira workflows","Copilot tasks appearing in project queues","Ticket routing that mixes human and bot agents"],"r":[{"n":"7.1","t":"Orchestration graph"},{"n":"5.5","t":"Execution progress view"},{"n":"10.1","t":"Fleet health dashboard"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"],"s":"assignment-boards-and-work-queues"},{"n":"7.6","t":"Escalation & fallback routing","d":"Automatic, graceful transfer to a human or stronger system when the agent hits its limits.","c":"7","o":"Failure is inevitable; dead ends are a choice. This pattern defines the paths out (to a human, a more capable model, a safer default) triggered by confidence collapse, repeated failure, or user frustration.","w":"The safety net determines how much users will trust the wire. Known, smooth escalation makes people comfortable starting with the agent.","u":["Customer-facing agents with human backstops","Tiered model architectures balancing cost and capability","Detection of user frustration or repeated failure loops"],"a":["Escalation that silently drops context and restarts the conversation"],"e":["Bot-to-agent escalation in Intercom and Zendesk","Model fallback chains on refusal or low confidence","'Talk to a human' affordances that actually work"],"r":[{"n":"7.4","t":"Agent handover briefs"},{"n":"9.2","t":"Guided repair flows"},{"n":"6.2","t":"Confidence thermometer"}],"f":0,"k":[],"rd":["Building Effective Agents (Anthropic","Human-Centered AI) Ben Shneiderman"],"s":"escalation-and-fallback-routing"},{"n":"8.1","t":"Memory inspector & editor","d":"A place to see, correct, and delete everything the agent remembers about you.","c":"8","o":"Memory without inspection is surveillance. The inspector lists remembered facts in plain language (where each came from, what it affects) with edit and delete as first-class actions.","w":"Visible, editable memory converts personalisation from creepy to collaborative. Users who can prune memory will let more of it grow.","u":["Persistent assistants that accumulate user facts","Personalisation whose effects users notice","Privacy-sensitive deployments"],"a":["Raw embedding dumps posing as 'memory transparency'"],"e":["ChatGPT's manage-memories interface","Remembered-preference lists in voice assistants","Ad preference managers as flawed prior art"],"r":[{"n":"8.5","t":"Personal context profiles"},{"n":"8.3","t":"Privacy & data usage controls"},{"n":"8.2","t":"Preference persona settings"}],"f":0,"k":[],"rd":["Microsoft HAX Toolkit","People + AI Guidebook, Google PAIR"],"s":"memory-inspector-and-editor"},{"n":"8.2","t":"Preference persona settings","d":"Durable, explicit settings for how the agent should behave: tone, verbosity, defaults, boundaries.","c":"8","o":"Users shouldn't re-litigate style every session. Persona settings capture standing preferences (terse or thorough, formal or warm, always-ask or just-do) applied consistently and overridable per task.","w":"Explicit preferences beat inferred ones for trust: the user wrote the rule, so the behaviour reads as obedience rather than profiling.","u":["Daily-use assistants across varied tasks","Teams standardising agent behaviour","Accessibility needs (reading level, verbosity, format)"],"a":["Settings sprawl duplicating what in-context requests handle better"],"e":["Custom instructions in ChatGPT","Style presets in writing assistants","Per-project agent rules files in coding tools"],"r":[{"n":"8.1","t":"Memory inspector & editor"},{"n":"2.3","t":"Progressive disclosure modes"},{"n":"1.2","t":"Delegation modes"}],"f":0,"k":[],"rd":["Microsoft HAX Toolkit","People + AI Guidebook, Google PAIR"],"s":"preference-persona-settings"},{"n":"8.3","t":"Privacy & data usage controls","d":"Clear, actionable controls over what data the agent accesses and how it is used, including for training.","c":"8","o":"The question users actually ask ('what happens to my stuff?') deserves a first-class answer. This pattern pairs plain-language disclosure with real controls: per-source access, training opt-outs, retention windows, one-tap revocation.","w":"Data confidence is a precondition for the deep access agents need to be useful. Opacity caps how much users will ever connect.","u":["Agents reading personal or corporate accounts","Products training on user interactions","Jurisdictions with data-protection regimes"],"a":["Consent theatre: walls of text with a single Accept button"],"e":["Training-data opt-outs in ChatGPT's data controls","Apple's privacy nutrition labels as disclosure prior art","Granular connector permissions in workspace AI tools"],"r":[{"n":"3.5","t":"Scoped permissions & tool consent"},{"n":"8.1","t":"Memory inspector & editor"},{"n":"1.1","t":"Agent identity & role contract"}],"f":0,"k":[],"rd":["Microsoft HAX Toolkit","People + AI Guidebook, Google PAIR"],"s":"privacy-and-data-usage-controls"},{"n":"8.4","t":"Context repository & workspace profiles","d":"Scoped, shared context (files, facts, conventions) attached to a project or team rather than a conversation.","c":"8","o":"Context that dies with the chat is context users must keep re-supplying. Repositories give context a durable home: project knowledge, style guides, key documents, loaded automatically wherever that work continues.","w":"Scoping context to workspaces matches how work is actually organised, and keeps personal, project, and organisational knowledge from bleeding into each other.","u":["Long-running projects with accumulated context","Teams sharing one agent across members","Consultants juggling clients whose contexts must not mix"],"a":["Single-conversation tasks that need no persistence"],"e":["Claude Projects and ChatGPT Projects","Workspace-level AI context in Notion","Repository rules files consumed by coding agents"],"r":[{"n":"8.5","t":"Personal context profiles"},{"n":"7.4","t":"Agent handover briefs"},{"n":"3.7","t":"User-directed tool use"}],"f":0,"k":[],"rd":["Microsoft HAX Toolkit","People + AI Guidebook, Google PAIR"],"s":"context-repository-and-workspace-profiles"},{"n":"8.5","t":"Personal context profiles","d":"The agent's working model of the individual user (role, goals, situation) held open for inspection and correction.","c":"8","o":"Every adaptive agent forms a theory of its user. This pattern makes that theory explicit: 'here is who I think you are and what you're trying to do', editable, and visibly connected to how behaviour changes.","w":"An inspectable user model transforms personalisation from inference done to you into a profile maintained with you. Corrections improve the agent faster than any signal it could mine.","u":["Long-relationship assistants adapting to their user","Role-dependent behaviour (founder vs. accountant vs. counsel)","Onboarding flows that infer context from connected data"],"a":["Sensitive inferred traits that should never be modelled, let alone displayed"],"e":["Inferred-interest profiles opened for editing (ad settings, done right)","Taste profiles in recommendation products","Role-based personalisation in onboarding flows"],"r":[{"n":"8.1","t":"Memory inspector & editor"},{"n":"8.2","t":"Preference persona settings"},{"n":"4.3","t":"Confirmed assumptions"}],"f":0,"k":[],"rd":["Microsoft HAX Toolkit","People + AI Guidebook, Google PAIR"],"s":"personal-context-profiles"},{"n":"9.1","t":"Safe failure states","d":"When the agent fails, it fails without damage: work preserved, systems intact, path forward clear.","c":"9","o":"Failure handling is architecture, not apology. Safe failure means partial work is saved, external systems are left consistent, destructive steps were staged not committed, and the user lands on 'here's what happened and what you can do', never a dead end.","w":"The cost of an agent's worst day determines how much users risk on its ordinary ones. Cheap failure makes bold delegation rational.","u":["Every agent that acts (this pattern is a floor, not a feature","Long tasks accumulating unsaved value","Actions staged against external systems"],"a":["Never) but beware failure states so soft that real failures go unnoticed"],"e":["Draft preservation on crash across mature editors","Transactional rollbacks leaving systems consistent","Agents halting before destructive steps and reporting state"],"r":[{"n":"3.6","t":"Rollback & version history"},{"n":"3.1","t":"Kill switch, pause & resume"},{"n":"9.2","t":"Guided repair flows"}],"f":0,"k":[],"rd":["People + AI Guidebook (Google PAIR (Errors + Graceful Failure)","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"],"s":"safe-failure-states"},{"n":"9.2","t":"Guided repair flows","d":"A structured path from agent error to fixed outcome, with the agent doing the heavy lifting.","c":"9","o":"'It's wrong' should begin a repair, not a support ticket. Guided repair walks the user through diagnosis (what's wrong, where, of which kind) then proposes targeted fixes, applies the chosen one, and verifies the result.","w":"Repair effort determines whether errors are potholes or cliffs. A cheap, reliable fix loop makes imperfect agents perfectly usable.","u":["Structured outputs where errors are localised and typed","Recurring failure modes worth productising","Users who can recognise wrong but can't specify right"],"a":["Freeform creative revision, where conversation serves better than a wizard"],"e":["Fix-with-AI loops on failing code and tests","Correction flows in document-extraction review queues","Merge-conflict resolution wizards as prior art"],"r":[{"n":"9.1","t":"Safe failure states"},{"n":"2.6","t":"Feedback & rating controls"},{"n":"4.2","t":"Edit request"}],"f":0,"k":[],"rd":["People + AI Guidebook (Google PAIR (Errors + Graceful Failure)","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"],"s":"guided-repair-flows"},{"n":"9.3","t":"Sentiment-aware response styles","d":"The agent reads frustration and adapts: shorter, humbler, faster to escalate.","c":"9","o":"Nothing enrages like chirpy obliviousness after a third failure. This pattern tunes tone and behaviour to the user's state (dropping the flourishes, acknowledging the miss, offering the exit) without pretending to feelings it doesn't have.","w":"De-escalation preserves the relationship through the failure. The behavioural changes matter more than the tone: frustrated users get brevity, options, and escalation, not sympathy theatre.","u":["Repeated failures within one session","Customer-facing agents in emotional domains","Moments before rage-quit, detectable in interaction signals"],"a":["Simulated emotional intimacy, adaptation must stay honest"],"e":["De-escalation modes in support bots","Terser retry behaviour after repeated corrections","Fast-tracked human handoff on detected frustration"],"r":[{"n":"7.6","t":"Escalation & fallback routing"},{"n":"9.4","t":"Apology & remedy bundle"},{"n":"2.6","t":"Feedback & rating controls"}],"f":0,"k":[],"rd":["People + AI Guidebook (Google PAIR (Errors + Graceful Failure)","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"],"s":"sentiment-aware-response-styles"},{"n":"9.4","t":"Apology & remedy bundle","d":"After a real failure: acknowledgment, plain explanation, concrete fix, and what will prevent recurrence, as one unit.","c":"9","o":"An apology without a remedy is PR; a fix without acknowledgment is gaslighting. The bundle delivers all four parts together, sized to the harm, a slipped deadline gets a sentence; corrupted work gets the full treatment.","w":"Service-recovery research is unambiguous: failures handled this way can leave more trust than no failure at all. Users don't expect perfection; they expect ownership.","u":["Failures with real user cost","Errors the user will discover anyway, get there first","Recurring failures, where the prevention clause is the point"],"a":["Reflexive apologising for trivia, which cheapens the currency"],"e":["Status-page postmortems: impact, cause, prevention","Proactive service recovery (refund before the complaint)","Agents reporting their own failure with remediation options"],"r":[{"n":"9.1","t":"Safe failure states"},{"n":"5.6","t":"Confessions view"},{"n":"9.3","t":"Sentiment-aware response styles"}],"f":0,"k":[],"rd":["People + AI Guidebook (Google PAIR (Errors + Graceful Failure)","Guidelines for Human-AI Interaction) Amershi et al., CHI 2019"],"s":"apology-and-remedy-bundle"},{"n":"10.1","t":"Fleet health dashboard","d":"Organisation-level monitoring of all deployed agents: activity, performance, cost, anomalies.","c":"10","o":"Ten agents are a team; a thousand are infrastructure. The fleet dashboard gives operators the aggregate view (throughput, error rates, spend, drift) with drill-down from anomaly to individual session.","w":"Organisations delegate at scale only when someone can answer 'are the agents okay?' at a glance. Observability is the price of fleet autonomy.","u":["Enterprise deployments beyond a handful of agents","Cost governance of model usage","Detecting degradation and drift early"],"a":["Solo products, where a usage page covers it"],"e":["LLM observability platforms (traces, evals, cost)","Copilot usage analytics for organisations","SRE dashboards as the design ancestor"],"r":[{"n":"5.4","t":"Activity timeline & audit log"},{"n":"10.2","t":"Risk & policy heatmaps"},{"n":"7.5","t":"Assignment boards & work queues"}],"f":0,"k":[],"rd":["Human-Centered AI (Ben Shneiderman","Building Effective Agents) Anthropic"],"s":"fleet-health-dashboard"},{"n":"10.2","t":"Risk & policy heatmaps","d":"A visual overlay showing where agent activity touches sensitive data, systems, and decisions.","c":"10","o":"Not all agent work carries equal risk. The heatmap maps activity against sensitivity (which agents touch PII, move money, face customers) so oversight attention lands where exposure actually is.","w":"Governance by heatmap replaces governance by anecdote. Compliance effort gets allocated by measured exposure, not by whoever shouted last.","u":["Regulated industries deploying agents broadly","Risk assessm
